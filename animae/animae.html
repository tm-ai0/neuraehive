<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>animæ — premier souffle</title>
<style>
  :root{
    --ink: 232, 224, 208;      /* warm off-white */
    --void: #050507;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; background:var(--void); overflow:hidden; }
  body{
    font-family:"Hoefler Text","Iowan Old Style","Palatino Linotype","URW Palladio L",P052,Palatino,serif;
    color:rgba(var(--ink),1);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    cursor:crosshair;
  }
  #stage{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  .overlay{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  .wordmark{
    position:fixed; top:clamp(14px,3vh,30px); left:clamp(16px,3vw,34px);
    font-size:clamp(15px,2.4vw,22px); letter-spacing:.42em; text-transform:lowercase;
    opacity:.5; font-weight:400; user-select:none;
    text-shadow:0 1px 18px rgba(0,0,0,.6);
  }
  .wordmark .state{
    display:block; margin-top:6px; font-size:.6em; letter-spacing:.5em; opacity:.62;
  }

  .toast{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(26px,7vw,64px); letter-spacing:.32em; text-transform:lowercase;
    opacity:0; transition:opacity 1.1s ease; user-select:none;
    text-shadow:0 2px 40px rgba(0,0,0,.7);
  }
  .toast.show{ opacity:.92; transition:opacity .18s ease; }

  .hint{
    position:fixed; left:50%; bottom:clamp(22px,5vh,46px); transform:translateX(-50%);
    font-size:clamp(11px,1.5vw,13.5px); letter-spacing:.22em; text-transform:lowercase;
    opacity:.0; transition:opacity 1.4s ease; white-space:nowrap; text-align:center;
    text-shadow:0 1px 16px rgba(0,0,0,.7);
  }
  .hint.show{ opacity:.42; }

  .tools{
    position:fixed; right:clamp(14px,3vw,30px); bottom:clamp(16px,4vh,34px);
    display:flex; gap:14px; z-index:7; pointer-events:auto;
    opacity:.0; transition:opacity 1s ease;
  }
  .tools.show{ opacity:.4; }
  .tools:hover{ opacity:.85; }
  .tools button{
    appearance:none; background:rgba(232,224,208,.06); border:1px solid rgba(232,224,208,.18);
    color:rgba(var(--ink),.9); width:40px; height:40px; border-radius:999px;
    font-size:16px; cursor:pointer; backdrop-filter:blur(8px); transition:.25s;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .tools button:hover{ background:rgba(232,224,208,.14); border-color:rgba(232,224,208,.4); }
  #file{ display:none; }

  .drophint{
    position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center;
    background:rgba(5,5,7,.55); backdrop-filter:blur(2px);
    font-size:clamp(16px,3vw,26px); letter-spacing:.3em; text-transform:lowercase; opacity:.9;
  }
  .drophint.show{ display:flex; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="overlay">
    <div class="wordmark">animæ<span class="state" id="stateName">éveil</span></div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint">touchez&nbsp;·&nbsp;maintenez&nbsp;·&nbsp;tapez pour changer&nbsp;·&nbsp;déposez une image</div>
  </div>

  <div class="tools" id="tools">
    <button id="imgBtn" title="déposer / charger une image">＋</button>
    <button id="fsBtn" title="plein écran">⤢</button>
  </div>
  <input type="file" id="file" accept="image/*" />

  <div class="drophint" id="drophint">relâchez pour insuffler la vie</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(!window.THREE){ document.body.innerHTML = "<div style='color:#e8e0d0;font:16px serif;padding:40px'>three.js n'a pas pu se charger.</div>"; return; }

  // ---------- États (presets morphables) ----------
  // chaque état = une humeur. on glisse de l'un à l'autre, jamais de saut brusque.
  const STATES = [
    { name:"éveil",     warp:0.34, speed:0.24, chroma:0.12, bloom:0.55, grain:0.05, scan:0.0, swirl:0.16, trails:0.25, tint:[1.06,0.99,0.86] },
    { name:"spectre",   warp:0.46, speed:0.34, chroma:0.62, bloom:0.50, grain:0.06, scan:0.0, swirl:0.10, trails:0.30, tint:[0.94,1.00,1.12] },
    { name:"rémanence", warp:0.40, speed:0.30, chroma:0.20, bloom:0.46, grain:0.05, scan:0.0, swirl:0.12, trails:0.92, tint:[1.02,0.93,1.10] },
    { name:"songe",     warp:0.72, speed:0.17, chroma:0.26, bloom:0.82, grain:0.04, scan:0.0, swirl:0.22, trails:0.55, tint:[1.12,0.98,1.02] },
    { name:"fracture",  warp:0.56, speed:0.62, chroma:0.36, bloom:0.34, grain:0.26, scan:0.85,swirl:0.08, trails:0.30, tint:[1.00,0.99,0.98] },
    { name:"tunnel",    warp:0.40, speed:0.30, chroma:0.30, bloom:0.56, grain:0.06, scan:0.0, swirl:0.95, trails:0.48, tint:[0.90,1.00,1.04] },
  ];

  // ---------- Three setup ----------
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:"high-performance" });
  renderer.setClearColor(0x050507, 1);
  const PR = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(PR);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.Camera();
  const geo = new THREE.PlaneGeometry(2, 2);

  const defaultTex = new THREE.DataTexture(new Uint8Array([0,0,0,255]), 1, 1, THREE.RGBAFormat);
  defaultTex.needsUpdate = true;

  const uniforms = {
    uTime:      { value: 0 },
    uRes:       { value: new THREE.Vector2(1, 1) },
    uPointer:   { value: new THREE.Vector2(0.5, 0.5) },
    uHold:      { value: 0 },
    uImage:     { value: defaultTex },
    uHasImage:  { value: 0 },
    uImgAspect: { value: 1 },
    uWarp:   { value: STATES[0].warp },
    uSpeed:  { value: STATES[0].speed },
    uChroma: { value: STATES[0].chroma },
    uBloom:  { value: STATES[0].bloom },
    uGrain:  { value: STATES[0].grain },
    uScan:   { value: STATES[0].scan },
    uSwirl:  { value: STATES[0].swirl },
    uTrails: { value: STATES[0].trails },
    uTint:   { value: new THREE.Vector3(STATES[0].tint[0], STATES[0].tint[1], STATES[0].tint[2]) },
  };

  const vert = `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;

  const frag = `
    uniform float uTime;
    uniform vec2  uRes;
    uniform vec2  uPointer;
    uniform float uHold;
    uniform sampler2D uImage;
    uniform float uHasImage;
    uniform float uImgAspect;
    uniform float uWarp;
    uniform float uSpeed;
    uniform float uChroma;
    uniform float uBloom;
    uniform float uGrain;
    uniform float uScan;
    uniform float uSwirl;
    uniform float uTrails;
    uniform vec3  uTint;
    varying vec2 vUv;

    float hash(vec2 p){
      p = fract(p * vec2(123.34, 345.45));
      p += dot(p, p + 34.345);
      return fract(p.x * p.y);
    }
    float noise(vec2 p){
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f*f*(3.0 - 2.0*f);
      float a = hash(i);
      float b = hash(i + vec2(1.0,0.0));
      float c = hash(i + vec2(0.0,1.0));
      float d = hash(i + vec2(1.0,1.0));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p){
      float v = 0.0; float a = 0.5;
      for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    vec2 rot(vec2 p, float ang){
      float c = cos(ang), s = sin(ang);
      return vec2(c*p.x - s*p.y, s*p.x + c*p.y);
    }
    vec2 coverUV(vec2 uv){
      float sa = uRes.x / uRes.y;
      float ia = uImgAspect;
      vec2 o = uv - 0.5;
      if(sa > ia){ o.y *= ia / sa; } else { o.x *= sa / ia; }
      return o + 0.5;
    }
    vec3 source(vec2 uv){
      if(uHasImage > 0.5){
        vec2 cu = clamp(coverUV(uv), 0.0, 1.0);
        return texture2D(uImage, cu).rgb;
      }
      // matière lumineuse procédurale (de la "matière inerte" qui a déjà un grain de vie)
      float t = uTime * 0.05;
      vec2 q = uv * 2.4;
      float n  = fbm(q + vec2(t*0.10, 0.0));
      float n2 = fbm(q * 2.0 + 7.0 - vec2(t*0.08, 0.0));
      float v = n*0.66 + n2*0.34;
      v = pow(clamp(v, 0.0, 1.0), 1.35);
      vec3 deep = vec3(0.03, 0.04, 0.08);
      vec3 mid  = vec3(0.34, 0.17, 0.42);
      vec3 hi   = vec3(1.00, 0.78, 0.45);
      vec3 col = mix(deep, mid, smoothstep(0.15, 0.55, v));
      col = mix(col, hi, smoothstep(0.55, 0.95, v));
      return col;
    }
    vec2 flowField(vec2 uv, float t){
      float n1 = fbm(uv*3.0 + vec2(0.0, t*0.6));
      float n2 = fbm(uv*3.0 + vec2(t*0.5, 5.2));
      vec2 f = vec2(n1, n2) - 0.5;
      vec2 toP = uv - uPointer;
      float d = length(toP);
      float swAmt = uSwirl * exp(-d*3.5) * 2.4;
      f += rot(toP, 1.5708) * swAmt;
      f += (uPointer - 0.5) * 0.25;
      return f;
    }

    void main(){
      vec2 uv = vUv;
      float t = uTime * uSpeed;
      float intensity = 1.0 + uHold * 2.2;

      vec2 dir = flowField(uv, t);
      float amp = uWarp * 0.18 * intensity;
      vec2 nd = normalize(dir + vec2(1e-4));
      vec2 base = uv + dir * amp;

      // échantillon principal + aberration chromatique le long du flux
      vec2 ca = nd * uChroma * 0.012 * intensity;
      vec3 col;
      col.r = source(base + ca).r;
      col.g = source(base).g;
      col.b = source(base - ca).b;

      // rémanence (traînées) — on revient en arrière le long du flux
      if(uTrails > 0.01){
        vec3 tr = vec3(0.0); float ws = 0.0;
        for(int i=1;i<4;i++){
          float k = float(i);
          float decay = exp(-k*0.7);
          vec2 suv = uv + dir * (amp + k * uTrails * 0.03 * intensity);
          tr += source(suv) * decay; ws += decay;
        }
        col = mix(col, col*0.5 + (tr / max(ws,0.001))*0.8, clamp(uTrails,0.0,1.0)*0.7);
      }

      // bloom (le souffle qui déborde de la lumière)
      vec3 bloom = vec3(0.0);
      for(int j=0;j<4;j++){
        float a = float(j)/4.0 * 6.2831853 + 0.4;
        vec2 off = vec2(cos(a), sin(a)) * 0.014 * (1.0 + uBloom);
        vec3 s = source(base + off);
        float l = max(max(s.r, s.g), s.b);
        bloom += s * smoothstep(0.62, 1.0, l);
      }
      col += (bloom / 4.0) * uBloom * 1.5;

      col *= uTint;

      float sl = mix(1.0, 0.55 + 0.45*sin(vUv.y * uRes.y * 1.4), uScan*0.6);
      col *= sl;

      float gr = hash(vUv*uRes + uTime*60.0) - 0.5;
      col += gr * uGrain;

      float vig = smoothstep(1.25, 0.35, length(vUv - 0.5) * 1.45);
      col *= vig;

      col = max(col, 0.0);
      col = pow(col, vec3(0.92));
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  const mat = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: vert,
    fragmentShader: frag,
    depthTest: false,
    depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // ---------- Resize ----------
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const bw = Math.floor(w * PR), bh = Math.floor(h * PR);
    uniforms.uRes.value.set(bw, bh);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Transitions d'état (glissement doux) ----------
  let idx = 0;
  const cur = Object.assign({}, STATES[0]);
  let tgt = STATES[0];

  function setState(i, announce){
    idx = (i % STATES.length + STATES.length) % STATES.length;
    tgt = STATES[idx];
    document.getElementById("stateName").textContent = tgt.name;
    if(announce){
      const toast = document.getElementById("toast");
      toast.textContent = tgt.name;
      toast.classList.add("show");
      clearTimeout(setState._t);
      setState._t = setTimeout(()=> toast.classList.remove("show"), 950);
    }
  }
  function nextState(){ setState(idx + 1, true); }

  function lerp(a, b, k){ return a + (b - a) * k; }

  // ---------- Pointer / interaction (le canvas EST l'instrument) ----------
  const rawPointer = { x:0.5, y:0.5 };
  let isDown = false, downTime = 0, downX = 0, downY = 0, moved = 0;

  function pos(e){
    const x = e.clientX / window.innerWidth;
    const y = 1.0 - e.clientY / window.innerHeight;
    return { x, y };
  }
  window.addEventListener("pointermove", (e)=>{
    const p = pos(e); rawPointer.x = p.x; rawPointer.y = p.y;
    if(isDown){ moved += Math.hypot(e.clientX - downX, e.clientY - downY); downX = e.clientX; downY = e.clientY; }
    revealHint(false);
  }, { passive:true });
  window.addEventListener("pointerdown", (e)=>{
    isDown = true; downTime = performance.now(); downX = e.clientX; downY = e.clientY; moved = 0;
    const p = pos(e); rawPointer.x = p.x; rawPointer.y = p.y;
    revealHint(false);
  });
  window.addEventListener("pointerup", (e)=>{
    isDown = false;
    const dt = performance.now() - downTime;
    if(dt < 280 && moved < 14){ nextState(); }   // tap = changer d'état ; drag/hold = jouer
  });
  window.addEventListener("pointercancel", ()=>{ isDown = false; });

  // clavier (bonus / VJ) : 1-6 = états, espace = figer, F = plein écran
  let paused = false;
  window.addEventListener("keydown", (e)=>{
    if(e.key === " "){ paused = !paused; e.preventDefault(); }
    else if(e.key.toLowerCase() === "f"){ toggleFS(); }
    else { const n = parseInt(e.key, 10); if(n >= 1 && n <= STATES.length){ setState(n-1, true); } }
  });

  // ---------- Image (la thèse : animer une image fixe) ----------
  const fileInput = document.getElementById("file");
  document.getElementById("imgBtn").addEventListener("click", ()=> fileInput.click());
  fileInput.addEventListener("change", (e)=>{ if(e.target.files && e.target.files[0]) loadImageFile(e.target.files[0]); });

  function loadImageFile(file){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const tex = new THREE.Texture(img);
      tex.needsUpdate = true;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      uniforms.uImage.value = tex;
      uniforms.uHasImage.value = 1;
      uniforms.uImgAspect.value = img.width / img.height;
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  const drophint = document.getElementById("drophint");
  window.addEventListener("dragover", (e)=>{ e.preventDefault(); drophint.classList.add("show"); });
  window.addEventListener("dragleave", (e)=>{ if(e.clientX === 0 && e.clientY === 0) drophint.classList.remove("show"); });
  window.addEventListener("drop", (e)=>{
    e.preventDefault(); drophint.classList.remove("show");
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
  });

  // ---------- Plein écran ----------
  function toggleFS(){
    if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){})(); }
    else { (document.exitFullscreen||function(){})(); }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFS);
  document.addEventListener("dblclick", toggleFS);

  // ---------- Hint / tools : visibles au repos, s'effacent dès qu'on joue ----------
  const hintEl = document.getElementById("hint");
  const toolsEl = document.getElementById("tools");
  let hintShown = false, firstTouch = false;
  function revealHint(initial){
    if(initial && !hintShown){ hintEl.classList.add("show"); toolsEl.classList.add("show"); hintShown = true; }
    if(!initial && !firstTouch){ firstTouch = true; hintEl.classList.remove("show"); }
  }
  setTimeout(()=> revealHint(true), 1400);
  setTimeout(()=>{ if(!firstTouch) hintEl.classList.remove("show"); }, 8000);

  // ---------- Boucle ----------
  const clock = new THREE.Clock();
  let simTime = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if(!paused) simTime += dt;

    // glissement doux des paramètres vers l'état cible
    const k = 1.0 - Math.exp(-dt * 3.2);
    cur.warp   = lerp(cur.warp,   tgt.warp,   k);
    cur.speed  = lerp(cur.speed,  tgt.speed,  k);
    cur.chroma = lerp(cur.chroma, tgt.chroma, k);
    cur.bloom  = lerp(cur.bloom,  tgt.bloom,  k);
    cur.grain  = lerp(cur.grain,  tgt.grain,  k);
    cur.scan   = lerp(cur.scan,   tgt.scan,   k);
    cur.swirl  = lerp(cur.swirl,  tgt.swirl,  k);
    cur.trails = lerp(cur.trails, tgt.trails, k);
    const tnt = uniforms.uTint.value;
    tnt.x = lerp(tnt.x, tgt.tint[0], k);
    tnt.y = lerp(tnt.y, tgt.tint[1], k);
    tnt.z = lerp(tnt.z, tgt.tint[2], k);

    // easing pointeur + maintien
    const pp = uniforms.uPointer.value;
    pp.x = lerp(pp.x, rawPointer.x, 1 - Math.exp(-dt * 6.0));
    pp.y = lerp(pp.y, rawPointer.y, 1 - Math.exp(-dt * 6.0));
    uniforms.uHold.value = lerp(uniforms.uHold.value, isDown ? 1 : 0, 1 - Math.exp(-dt * 5.0));

    uniforms.uTime.value   = simTime;
    uniforms.uWarp.value   = cur.warp;
    uniforms.uSpeed.value  = cur.speed;
    uniforms.uChroma.value = cur.chroma;
    uniforms.uBloom.value  = cur.bloom;
    uniforms.uGrain.value  = cur.grain;
    uniforms.uScan.value   = cur.scan;
    uniforms.uSwirl.value  = cur.swirl;
    uniforms.uTrails.value = cur.trails;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
