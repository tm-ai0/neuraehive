<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mycelial Intelligence — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark:       #141413;
            --anthropic-light:      #faf9f5;
            --anthropic-mid-gray:   #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange:     #d97757;
            --anthropic-blue:       #6a9bcc;
            --anthropic-green:      #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20,20,19,0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 21px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 12px;
            margin-bottom: 26px;
            line-height: 1.55;
        }

        .control-section { margin-bottom: 26px; }

        .control-section h3 {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
        }

        /* Phase badge */
        .phase-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: none;
            margin-left: auto;
            transition: all 0.4s ease;
        }
        .phase-growing { background: rgba(120,140,93,0.15); color: var(--anthropic-green); }
        .phase-pulsing { background: rgba(217,119,87,0.15); color: var(--anthropic-orange); }

        /* Seed */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
            color: var(--anthropic-dark);
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217,119,87,0.12);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        /* Controls */
        .control-group { margin-bottom: 14px; }

        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 3px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px;
            background: var(--anthropic-orange);
            border-radius: 50%; border: none; cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 46px;
            text-align: right;
        }

        /* Colors */
        .color-group { margin-bottom: 10px; }
        .color-group label { display: block; font-size: 11px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] {
            width: 28px; height: 28px;
            border: none; border-radius: 6px;
            cursor: pointer; background: none; padding: 0;
        }
        .color-value { font-family: 'Courier New', monospace; font-size: 11px; color: var(--anthropic-mid-gray); }

        /* Buttons */
        .button {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 7px;
        }
        .btn-primary { background: var(--anthropic-orange); color: white; }
        .btn-primary:hover { background: #c86641; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--anthropic-light);
            color: var(--anthropic-dark);
            border: 1px solid var(--anthropic-light-gray);
        }
        .btn-secondary:hover { background: var(--anthropic-light-gray); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

        /* Canvas */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container canvas {
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(20,20,19,0.25);
            max-width: 100%;
            max-height: calc(100vh - 40px);
            display: block;
        }

        .loading {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            padding: 40px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--anthropic-light-gray);
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ═══ SIDEBAR ═══ -->
    <div class="sidebar">
        <h1>Mycelial Intelligence</h1>
        <p class="subtitle">Decentralized networks emerging from spore — bioluminescent signals propagating through organic darkness.</p>

        <!-- Seed -->
        <div class="control-section">
            <h3>Seed <span class="phase-badge phase-growing" id="phase-badge">Growing</span></h3>
            <input type="text" class="seed-input" id="seed-input" value="42" onchange="updateSeed()">
            <div class="seed-controls">
                <button class="button btn-secondary" onclick="previousSeed()">← Prev</button>
                <button class="button btn-secondary" onclick="nextSeed()">Next →</button>
            </div>
            <button class="button btn-secondary" onclick="randomSeedAndUpdate()">⚄ Random Seed</button>
        </div>

        <!-- Network -->
        <div class="control-section">
            <h3>Network</h3>

            <div class="control-group">
                <label>Spore Count</label>
                <div class="slider-container">
                    <input type="range" id="sporeCount" min="3" max="22" step="1" value="10"
                        oninput="updateNetworkParam('sporeCount', parseFloat(this.value))">
                    <span class="value-display" id="sporeCount-value">10</span>
                </div>
            </div>

            <div class="control-group">
                <label>Growth Density</label>
                <div class="slider-container">
                    <input type="range" id="tipsPerSpore" min="2" max="9" step="1" value="4"
                        oninput="updateNetworkParam('tipsPerSpore', parseFloat(this.value))">
                    <span class="value-display" id="tipsPerSpore-value">4</span>
                </div>
            </div>

            <div class="control-group">
                <label>Noise Warp</label>
                <div class="slider-container">
                    <input type="range" id="noiseScale" min="0.001" max="0.014" step="0.001" value="0.004"
                        oninput="updateNetworkParam('noiseScale', parseFloat(this.value))">
                    <span class="value-display" id="noiseScale-value">0.004</span>
                </div>
            </div>

            <div class="control-group">
                <label>Tendril Length</label>
                <div class="slider-container">
                    <input type="range" id="maxAge" min="80" max="650" step="20" value="340"
                        oninput="updateNetworkParam('maxAge', parseFloat(this.value))">
                    <span class="value-display" id="maxAge-value">340</span>
                </div>
            </div>

            <div class="control-group">
                <label>Branching</label>
                <div class="slider-container">
                    <input type="range" id="branchProb" min="0" max="0.012" step="0.001" value="0.004"
                        oninput="updateNetworkParam('branchProb', parseFloat(this.value))">
                    <span class="value-display" id="branchProb-value">0.004</span>
                </div>
            </div>
        </div>

        <!-- Signal -->
        <div class="control-section">
            <h3>Signal</h3>

            <div class="control-group">
                <label>Pulse Count</label>
                <div class="slider-container">
                    <input type="range" id="pulseCount" min="2" max="24" step="1" value="12"
                        oninput="updatePulseParam('pulseCount', parseFloat(this.value))">
                    <span class="value-display" id="pulseCount-value">12</span>
                </div>
            </div>

            <div class="control-group">
                <label>Signal Speed</label>
                <div class="slider-container">
                    <input type="range" id="pulseSpeed" min="0.5" max="9" step="0.5" value="3"
                        oninput="updatePulseParam('pulseSpeed', parseFloat(this.value))">
                    <span class="value-display" id="pulseSpeed-value">3</span>
                </div>
            </div>

            <div class="control-group">
                <label>Glow Radius</label>
                <div class="slider-container">
                    <input type="range" id="glowRadius" min="3" max="32" step="1" value="14"
                        oninput="updatePulseParam('glowRadius', parseFloat(this.value))">
                    <span class="value-display" id="glowRadius-value">14</span>
                </div>
            </div>
        </div>

        <!-- Colors -->
        <div class="control-section">
            <h3>Colors</h3>
            <div class="color-group">
                <label>Background</label>
                <div class="color-picker-container">
                    <input type="color" id="bgColor" value="#0d0a07" onchange="updateColorParam('bgColor', this.value)">
                    <span class="color-value" id="bgColor-value">#0d0a07</span>
                </div>
            </div>
            <div class="color-group">
                <label>Tendril</label>
                <div class="color-picker-container">
                    <input type="color" id="tendrilColor" value="#c4b8a0" onchange="updateColorParam('tendrilColor', this.value)">
                    <span class="color-value" id="tendrilColor-value">#c4b8a0</span>
                </div>
            </div>
            <div class="color-group">
                <label>Primary Signal</label>
                <div class="color-picker-container">
                    <input type="color" id="pulseColor" value="#f0a030" onchange="updateColorParam('pulseColor', this.value)">
                    <span class="color-value" id="pulseColor-value">#f0a030</span>
                </div>
            </div>
            <div class="color-group">
                <label>Secondary Signal</label>
                <div class="color-picker-container">
                    <input type="color" id="pulseColor2" value="#60c8f0" onchange="updateColorParam('pulseColor2', this.value)">
                    <span class="color-value" id="pulseColor2-value">#60c8f0</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="control-section">
            <h3>Actions</h3>
            <button class="button btn-primary" onclick="triggerRegen()">↺ Regenerate</button>
            <div class="btn-row">
                <button class="button btn-secondary" onclick="resetAll()">Reset</button>
                <button class="button btn-secondary" onclick="downloadPNG()">↓ PNG</button>
            </div>
        </div>
    </div>

    <!-- ═══ CANVAS ═══ -->
    <div class="canvas-area">
        <div id="canvas-container">
            <div class="loading">Growing network…</div>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
//  MYCELIAL INTELLIGENCE — Algorithmic Art
//  Philosophy: Networks of decentralized intelligence, emergent from
//  seeded spores. Chemical signals travel the grown hyphae, revealing
//  the invisible topology of organic computation.
// ════════════════════════════════════════════════════════════════════════

let params = {
    seed:         42,
    sporeCount:   10,
    tipsPerSpore: 4,
    noiseScale:   0.004,
    maxAge:       340,
    branchProb:   0.004,
    pulseCount:   12,
    pulseSpeed:   3,
    glowRadius:   14,
    bgColor:      '#0d0a07',
    tendrilColor: '#c4b8a0',
    pulseColor:   '#f0a030',
    pulseColor2:  '#60c8f0'
};

const defaultParams = { ...params };

// State
let tips         = [];
let paths        = [];
let pulses       = [];
let phase        = 'growing';
let tipsAlive    = 0;
let pg           = null;   // offscreen graphics buffer for tendril network
let regenPending = false;

// ── Tip (growing hypha) ────────────────────────────────────────────────

class Tip {
    constructor(x, y, angle, pathRef, generation) {
        this.x    = x;
        this.y    = y;
        this.angle = angle;
        this.path  = pathRef;
        this.gen   = generation || 0;   // 0 = primary, 1 = branch
        this.age   = 0;
        this.alive = true;
        this.path.push({ x: this.x, y: this.y });
        tipsAlive++;
    }

    grow() {
        if (!this.alive) return;

        // Multi-octave noise steering
        let n1 = noise(this.x * params.noiseScale + 100,
                       this.y * params.noiseScale + 100);
        let n2 = noise(this.x * params.noiseScale * 3.5 + 500,
                       this.y * params.noiseScale * 3.5 + 500);

        this.angle += map(n1, 0, 1, -0.30, 0.30);
        this.angle += map(n2, 0, 1, -0.07, 0.07);

        // Slightly slower for branch generation
        let spd = this.gen === 0 ? 1.9 : 1.4;
        this.x  += cos(this.angle) * spd;
        this.y  += sin(this.angle) * spd;
        this.path.push({ x: this.x, y: this.y });
        this.age++;

        // Branching
        let maxAgeForGen = this.gen === 0 ? params.maxAge : params.maxAge * 0.5;
        if (this.gen === 0 && this.age > 30 && random() < params.branchProb) {
            let branchAngle = this.angle + random([-1, 1]) * random(0.4, 0.9);
            let bPath = [];
            paths.push(bPath);
            tips.push(new Tip(this.x, this.y, branchAngle, bPath, 1));
        }

        // Death conditions
        let margin = 15;
        if (this.x < -margin || this.x > width + margin ||
            this.y < -margin || this.y > height + margin ||
            this.age >= maxAgeForGen) {
            this.alive = false;
            tipsAlive--;
        }
    }
}

// ── Pulse (traveling signal) ───────────────────────────────────────────

class Pulse {
    constructor(isPrimary) {
        this.isPrimary = isPrimary !== undefined ? isPrimary : random() > 0.5;
        this.waitFrames = floor(random(0, 60));
        this._assignPath();
    }

    _assignPath() {
        let eligible = paths.filter(p => p.length > 15);
        if (eligible.length === 0) { this.dead = true; return; }
        this.currentPath = random(eligible);
        this.forward     = random() > 0.5;
        this.t           = this.forward ? 0 : this.currentPath.length - 1;
        this.dead        = false;
    }

    update() {
        if (this.waitFrames > 0) { this.waitFrames--; return; }
        if (this.dead) return;

        let step = params.pulseSpeed;
        this.t += this.forward ? step : -step;

        if (this.forward  && this.t >= this.currentPath.length - 1) { this.dead = true; }
        if (!this.forward && this.t <= 0)                            { this.dead = true; }
    }

    draw() {
        if (this.waitFrames > 0 || this.dead) return;

        let idx = constrain(floor(this.t), 0, this.currentPath.length - 1);
        let pt  = this.currentPath[idx];
        if (!pt) return;

        let col = hexToRGB(this.isPrimary ? params.pulseColor : params.pulseColor2);

        noStroke();

        // Layered soft glow (additive blend handles the bloom)
        let layers = [
            { r: params.glowRadius * 3.2, a: 18 },
            { r: params.glowRadius * 2.0, a: 40 },
            { r: params.glowRadius * 1.2, a: 80 },
            { r: params.glowRadius * 0.6, a: 160 },
        ];
        for (let l of layers) {
            fill(col.r, col.g, col.b, l.a);
            ellipse(pt.x, pt.y, l.r, l.r);
        }
        // Bright core
        fill(255, 248, 235, 230);
        ellipse(pt.x, pt.y, params.glowRadius * 0.28, params.glowRadius * 0.28);
    }

    respawn() {
        this._assignPath();
        this.waitFrames = floor(random(10, 80));
    }
}

// ── p5 lifecycle ───────────────────────────────────────────────────────

function setup() {
    let canvas = createCanvas(900, 900);
    canvas.parent('canvas-container');
    document.querySelector('.loading').style.display = 'none';
    pg = createGraphics(900, 900);
    frameRate(60);
    initializeSystem();
}

function draw() {
    if (regenPending) {
        regenPending = false;
        initializeSystem();
        return;
    }
    if (phase === 'growing') growthStep();
    else                     pulseStep();
}

// ── Phase: Growing ─────────────────────────────────────────────────────

function initializeSystem() {
    tips      = [];
    paths     = [];
    pulses    = [];
    tipsAlive = 0;
    phase     = 'growing';

    randomSeed(params.seed);
    noiseSeed(params.seed);

    let bg = hexToRGB(params.bgColor);
    pg.background(bg.r, bg.g, bg.b);
    background(bg.r, bg.g, bg.b);

    let tc = hexToRGB(params.tendrilColor);
    let margin = 100;

    for (let s = 0; s < params.sporeCount; s++) {
        let sx = random(margin, width  - margin);
        let sy = random(margin, height - margin);

        // Draw spore node on pg
        pg.noStroke();
        pg.fill(tc.r, tc.g, tc.b, 50);
        pg.ellipse(sx, sy, 9, 9);
        pg.fill(tc.r, tc.g, tc.b, 110);
        pg.ellipse(sx, sy, 4.5, 4.5);

        for (let t = 0; t < params.tipsPerSpore; t++) {
            let angle = (t / params.tipsPerSpore) * TWO_PI + random(-0.4, 0.4);
            let pArr  = [];
            paths.push(pArr);
            tips.push(new Tip(sx, sy, angle, pArr, 0));
        }
    }

    updatePhaseBadge();
    image(pg, 0, 0);
}

function growthStep() {
    let tc = hexToRGB(params.tendrilColor);
    pg.strokeWeight(0.55);
    pg.noFill();

    let alive = 0;
    for (let tip of tips) {
        if (!tip.alive) continue;
        alive++;

        let px = tip.x, py = tip.y;
        // Fade opacity with generation and age
        let baseAlpha = tip.gen === 0 ? 24 : 14;
        let ageAlpha  = map(tip.age, 0, params.maxAge, baseAlpha, baseAlpha * 0.4);
        pg.stroke(tc.r, tc.g, tc.b, ageAlpha);

        tip.grow();

        pg.line(px, py, tip.x, tip.y);
    }

    // Composite to main canvas
    background(hexToRGB(params.bgColor).r, hexToRGB(params.bgColor).g, hexToRGB(params.bgColor).b);
    image(pg, 0, 0);

    if (tipsAlive <= 0) transitionToPulsing();
}

function transitionToPulsing() {
    phase = 'pulsing';

    // Spawn staggered pulses
    for (let i = 0; i < params.pulseCount; i++) {
        let p = new Pulse(i % 3 !== 0);
        p.waitFrames = floor(random(0, 120));
        pulses.push(p);
    }
    updatePhaseBadge();
}

// ── Phase: Pulsing ─────────────────────────────────────────────────────

function pulseStep() {
    let bg = hexToRGB(params.bgColor);
    background(bg.r, bg.g, bg.b);
    image(pg, 0, 0);

    blendMode(ADD);
    noStroke();

    for (let p of pulses) {
        p.update();
        p.draw();
        if (p.dead) p.respawn();
    }

    blendMode(BLEND);
}

// ── Param updates ──────────────────────────────────────────────────────

function updateNetworkParam(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent = value;
    triggerRegen();
}

function updatePulseParam(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent = value;
    if (phase === 'pulsing' && name === 'pulseCount') syncPulseCount();
}

function updateColorParam(id, value) {
    params[id] = value;
    document.getElementById(id + '-value').textContent = value;
    triggerRegen();
}

function syncPulseCount() {
    while (pulses.length < params.pulseCount) {
        let p = new Pulse();
        p.waitFrames = floor(random(5, 40));
        pulses.push(p);
    }
    while (pulses.length > params.pulseCount) pulses.pop();
}

// ── Seed controls ──────────────────────────────────────────────────────

function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

function updateSeed() {
    let v = parseInt(document.getElementById('seed-input').value);
    if (v > 0) { params.seed = v; triggerRegen(); }
    else updateSeedDisplay();
}

function previousSeed()      { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); triggerRegen(); }
function nextSeed()           { params.seed++;                               updateSeedDisplay(); triggerRegen(); }
function randomSeedAndUpdate(){ params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); triggerRegen(); }

function triggerRegen() { regenPending = true; }

// ── Reset ──────────────────────────────────────────────────────────────

function resetAll() {
    params = { ...defaultParams };
    const ids = ['sporeCount','tipsPerSpore','noiseScale','maxAge','branchProb',
                 'pulseCount','pulseSpeed','glowRadius'];
    for (let id of ids) {
        let el = document.getElementById(id);
        if (el) el.value = params[id];
        let vEl = document.getElementById(id + '-value');
        if (vEl) vEl.textContent = params[id];
    }
    const cols = ['bgColor','tendrilColor','pulseColor','pulseColor2'];
    for (let c of cols) {
        document.getElementById(c).value          = params[c];
        document.getElementById(c + '-value').textContent = params[c];
    }
    updateSeedDisplay();
    triggerRegen();
}

// ── Download ───────────────────────────────────────────────────────────

function downloadPNG() { saveCanvas('mycelial-intelligence', 'png'); }

// ── Helpers ────────────────────────────────────────────────────────────

function hexToRGB(hex) {
    hex = hex.replace('#', '');
    return {
        r: parseInt(hex.slice(0,2), 16),
        g: parseInt(hex.slice(2,4), 16),
        b: parseInt(hex.slice(4,6), 16)
    };
}

function updatePhaseBadge() {
    let badge = document.getElementById('phase-badge');
    if (phase === 'growing') {
        badge.textContent  = 'Growing';
        badge.className    = 'phase-badge phase-growing';
    } else {
        badge.textContent  = 'Pulsing';
        badge.className    = 'phase-badge phase-pulsing';
    }
}

window.addEventListener('load', updateSeedDisplay);
</script>
</body>
</html>
