<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINERÆ</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ddcc;
        --ink-bright: #f2e7d3;
        --ink-dim: rgba(232, 221, 204, 0.5);
        --ink-faint: rgba(232, 221, 204, 0.14);
        --bg: #050403;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      canvas#stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      /* ---- intro (the title itself is particles on the canvas) ---- */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 56vh;
        gap: 1.5rem;
        opacity: 0;
        transition-property: opacity;
        transition-duration: 1.4s;
        transition-timing-function: ease-out;
        z-index: 10;
      }
      #overlay.shown {
        opacity: 1;
      }
      #overlay.gone {
        opacity: 0;
        transition-duration: 0.9s;
      }
      #overlay p {
        max-width: 34rem;
        text-align: center;
        font-size: 0.82rem;
        line-height: 1.7;
        letter-spacing: 0.08em;
        color: var(--ink-dim);
        padding: 0 1.5rem;
        text-wrap: pretty;
      }
      #overlay .buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        pointer-events: auto;
      }
      #overlay.gone .buttons {
        pointer-events: none;
      }
      #overlay button {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.4);
        color: var(--ink);
        padding: 0.85rem 1.8rem;
        min-height: 44px;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, scale;
        transition-duration: 0.25s;
        transition-timing-function: ease-out;
      }
      #overlay button:hover {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.8);
      }
      #overlay button:active {
        scale: 0.96;
      }
      #overlay .error {
        color: #d9a08a;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        min-height: 1.2em;
      }

      /* ---- settings panel ---- */
      .cinerae-panel {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 17rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        padding: 0.85rem 1rem 1rem;
        background: rgba(5, 4, 3, 0.78);
        border: 1px solid var(--ink-faint);
        backdrop-filter: blur(8px);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        z-index: 20;
        user-select: none;
        transition-property: opacity, translate;
        transition-duration: 0.3s;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .cinerae-panel.collapsed {
        opacity: 0;
        translate: 0 -0.5rem;
        pointer-events: none;
      }
      .cinerae-open {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        appearance: none;
        background: rgba(5, 4, 3, 0.7);
        border: 1px solid var(--ink-faint);
        color: var(--ink-dim);
        cursor: pointer;
        z-index: 19;
        opacity: 0;
        pointer-events: none;
        transition-property: opacity, color, scale;
        transition-duration: 0.25s;
        transition-timing-function: ease-out;
      }
      .cinerae-open.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .cinerae-open:hover {
        color: var(--ink-bright);
      }
      .cinerae-open:active {
        scale: 0.96;
      }
      .cinerae-open svg {
        width: 20px;
        height: 20px;
      }
      .cinerae-handle {
        display: none;
      }
      .cinerae-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.15rem;
      }
      .cinerae-fps {
        font-size: 0.92rem;
        letter-spacing: 0.18em;
        color: var(--ink-bright);
        font-variant-numeric: tabular-nums;
      }
      .cinerae-close {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--ink-dim);
        font-size: 1rem;
        line-height: 1;
        width: 32px;
        height: 32px;
        margin: -6px -8px 0 0;
        cursor: pointer;
        transition-property: color;
        transition-duration: 0.2s;
      }
      .cinerae-close:hover {
        color: var(--ink-bright);
      }
      .cinerae-status {
        color: var(--ink-dim);
        margin-bottom: 0.7rem;
        min-height: 1em;
      }
      .cinerae-lang {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.25);
        color: var(--ink-dim);
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 0.15rem 0.5rem;
        margin-left: auto;
        margin-right: 0.4rem;
        min-height: 26px;
        cursor: pointer;
        transition-property: color, border-color;
        transition-duration: 0.2s;
      }
      .cinerae-lang:hover {
        color: var(--ink-bright);
        border-color: rgba(232, 221, 204, 0.55);
      }
      .cinerae-crystal {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 0.85rem;
      }
      .cinerae-crystal-label {
        color: var(--ink-dim);
      }
      .cinerae-crystal-track {
        flex: 1;
        height: 3px;
        background: rgba(232, 221, 204, 0.12);
        overflow: hidden;
      }
      .cinerae-crystal-fill {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--ink);
        transition-property: width;
        transition-duration: 0.2s;
        transition-timing-function: linear;
      }
      .cinerae-modes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        border: 1px solid var(--ink-faint);
        margin-bottom: 0.85rem;
      }
      .cinerae-modes button {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--ink-dim);
        padding: 0.5rem 0.2rem;
        min-height: 34px;
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-modes button.active {
        background: rgba(232, 221, 204, 0.12);
        color: var(--ink-bright);
      }
      .cinerae-sensors {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.85rem;
      }
      .cinerae-switch {
        appearance: none;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(232, 221, 204, 0.78);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        padding: 0.35rem 0;
        min-height: 34px;
        cursor: pointer;
      }
      .cinerae-switch-track {
        position: relative;
        width: 34px;
        height: 18px;
        border-radius: 9px;
        border: 1px solid rgba(232, 221, 204, 0.3);
        transition-property: background-color, border-color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 6px;
        background: var(--ink-dim);
        transition-property: translate, background-color;
        transition-duration: 0.2s;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .cinerae-switch[aria-checked="true"] .cinerae-switch-track {
        background: rgba(232, 221, 204, 0.18);
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-switch[aria-checked="true"] .cinerae-switch-thumb {
        translate: 16px 0;
        background: var(--ink-bright);
      }
      .cinerae-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
        margin-bottom: 0.85rem;
      }
      .cinerae-actions button {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.35);
        color: var(--ink);
        padding: 0.5rem 0;
        min-height: 36px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, scale;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-actions button:hover {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.7);
      }
      .cinerae-actions button:active {
        scale: 0.96;
      }
      .cinerae-imprints {
        margin-bottom: 0.85rem;
        padding-top: 0.55rem;
        border-top: 1px solid var(--ink-faint);
      }
      .cinerae-imprints-title {
        color: var(--ink-dim);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.6rem;
        margin-bottom: 0.45rem;
      }
      .cinerae-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.45rem;
      }
      .cinerae-chip {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.22);
        color: var(--ink-dim);
        padding: 0.28rem 0.55rem;
        min-height: 28px;
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition-property: background-color, border-color, color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-chip:hover {
        border-color: rgba(232, 221, 204, 0.55);
        color: var(--ink);
      }
      .cinerae-chip.active {
        background: rgba(232, 221, 204, 0.14);
        border-color: rgba(232, 221, 204, 0.7);
        color: var(--ink-bright);
      }
      .cinerae-text-row input {
        width: 100%;
        appearance: none;
        background: rgba(232, 221, 204, 0.06);
        border: 1px solid rgba(232, 221, 204, 0.25);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        padding: 0.45rem 0.55rem;
        margin-bottom: 0.45rem;
      }
      .cinerae-text-row input:focus {
        outline: none;
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-drop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-bright);
        background: rgba(5, 4, 3, 0.55);
        border: 1px dashed rgba(232, 221, 204, 0.45);
        z-index: 25;
        pointer-events: none;
      }
      .cinerae-drop.visible {
        display: flex;
      }
      .cinerae-row {
        display: grid;
        grid-template-columns: 1fr auto;
        row-gap: 0.15rem;
        margin-bottom: 0.55rem;
        padding-left: 0.4rem;
        margin-left: -0.4rem;
        border-left: 2px solid transparent;
        color: rgba(232, 221, 204, 0.78);
        transition-property: background-color, border-color;
        transition-duration: 0.6s;
        transition-timing-function: ease-out;
      }
      /* The touched slider takes a warm edge; the rest sleeps. */
      .cinerae-row:hover,
      .cinerae-row:focus-within {
        border-left-color: rgba(224, 160, 92, 0.85);
      }
      .cinerae-row-name {
        cursor: pointer;
      }
      /* Dust track: a static dotted bed under the thumb — pure CSS, the
       * frame never pays for it. */
      .cinerae-row input[type="range"] {
        grid-column: 1 / 3;
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        height: 1.15rem;
        cursor: pointer;
      }
      .cinerae-row input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 4px;
        background-image:
          radial-gradient(circle, rgba(232, 221, 204, 0.4) 0.8px, transparent 1.1px),
          radial-gradient(circle, rgba(232, 221, 204, 0.22) 0.6px, transparent 0.9px);
        background-size: 7px 5px, 5px 3px;
        background-position: 0 1px, 3px 2px;
      }
      .cinerae-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        margin-top: -2.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 35%, #f2e7d3, #a99a7e);
        box-shadow: 0 0 5px rgba(232, 221, 204, 0.35);
      }
      .cinerae-row input[type="range"]::-moz-range-track {
        height: 8px;
        border-radius: 4px;
        background-image:
          radial-gradient(circle, rgba(232, 221, 204, 0.4) 0.8px, transparent 1.1px);
        background-size: 7px 5px;
      }
      .cinerae-row input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 35%, #f2e7d3, #a99a7e);
      }
      /* One-line hint, revealed at touch, under the row it belongs to. */
      .cinerae-row[data-hint]::after,
      .cinerae-select-row[data-hint]::after,
      .cinerae-pastilles[data-hint]::after,
      .cinerae-chips[data-hint]::after,
      .cinerae-colors[data-hint]::after {
        content: attr(data-hint);
        display: none;
        grid-column: 1 / 3;
        flex-basis: 100%;
        color: rgba(232, 221, 204, 0.55);
        font-size: 0.6rem;
        letter-spacing: 0.05em;
        line-height: 1.5;
        padding-top: 0.1rem;
        text-wrap: pretty;
      }
      .cinerae-row[data-hint]:hover::after,
      .cinerae-row[data-hint]:focus-within::after,
      .cinerae-select-row[data-hint]:hover::after,
      .cinerae-select-row[data-hint]:focus-within::after,
      .cinerae-pastilles[data-hint]:hover::after,
      .cinerae-pastilles[data-hint]:focus-within::after,
      .cinerae-chips[data-hint]:hover::after,
      .cinerae-colors[data-hint]:hover::after {
        display: block;
      }
      .cinerae-row .cinerae-value {
        justify-self: end;
        align-self: end;
        color: rgba(232, 221, 204, 0.45);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition-property: color;
        transition-duration: 0.5s;
        transition-timing-function: ease-out;
      }
      .cinerae-row.changed {
        background-color: rgba(232, 221, 204, 0.08);
        transition-duration: 0.12s;
      }
      .cinerae-row.changed input[type="range"] {
        accent-color: var(--ink-bright);
      }
      .cinerae-row.changed .cinerae-value {
        color: var(--ink-bright);
      }

      /* ---- collapsible sections: strata of sediment ---- */
      /* No separator lines: each section is a stratum of earth, warm linen
       * at the top down to soot, tinted at low saturation by the active
       * palette (--strata-tint, set by the panel). The bottom edge of each
       * stratum is a slightly wavy cut, like a soil section. */
      .cinerae-panel {
        --strata-tint: rgb(232 221 204);
      }
      .cinerae-section {
        margin: 0 -1rem;
        padding: 0 1rem 0.35rem;
        clip-path: polygon(
          0 0, 100% 0,
          100% calc(100% - 4px), 91% calc(100% - 1px), 79% calc(100% - 5px),
          64% calc(100% - 2px), 50% calc(100% - 6px), 36% calc(100% - 2px),
          22% calc(100% - 5px), 10% calc(100% - 1px), 0 calc(100% - 4px)
        );
      }
      .cinerae-section:nth-child(even) {
        clip-path: polygon(
          0 0, 100% 0,
          100% calc(100% - 2px), 88% calc(100% - 6px), 74% calc(100% - 1px),
          58% calc(100% - 5px), 43% calc(100% - 2px), 29% calc(100% - 6px),
          15% calc(100% - 3px), 6% calc(100% - 6px), 0 calc(100% - 2px)
        );
      }
      .cinerae-strata-scenes  { background: color-mix(in srgb, var(--strata-tint) 10%, #241e16); }
      .cinerae-strata-moi     { background: color-mix(in srgb, var(--strata-tint) 12%, #221c14); }
      .cinerae-strata-geste   { background: color-mix(in srgb, var(--strata-tint) 11%, #1e1913); }
      .cinerae-strata-voix    { background: color-mix(in srgb, var(--strata-tint) 10%, #1b1611); }
      .cinerae-strata-temps   { background: color-mix(in srgb, var(--strata-tint) 9%, #18130e); }
      .cinerae-strata-look    { background: color-mix(in srgb, var(--strata-tint) 8%, #15100c); }
      .cinerae-strata-empreintes { background: color-mix(in srgb, var(--strata-tint) 7%, #130f0b); }
      .cinerae-strata-modulation { background: color-mix(in srgb, var(--strata-tint) 6%, #120e0a); }
      .cinerae-strata-midi    { background: color-mix(in srgb, var(--strata-tint) 6%, #110d09); }
      .cinerae-strata-aide    { background: color-mix(in srgb, var(--strata-tint) 5%, #0f0c08); }
      .cinerae-section-head {
        appearance: none;
        background: transparent;
        border: none;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--ink-dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.6rem;
        padding: 0.55rem 0 0.45rem;
        cursor: pointer;
        transition-property: color;
        transition-duration: 0.2s;
        text-align: left;
      }
      .cinerae-section-head:hover {
        color: var(--ink);
      }
      .cinerae-sketch {
        display: inline-flex;
        width: 18px;
        height: 18px;
        flex: none;
        opacity: 0.8;
      }
      .cinerae-sketch svg {
        width: 100%;
        height: 100%;
      }
      .cinerae-section-title {
        flex: 1;
      }
      .cinerae-section-caret {
        width: 0;
        height: 0;
        border-left: 4px solid currentColor;
        border-top: 3.5px solid transparent;
        border-bottom: 3.5px solid transparent;
        transition-property: rotate;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-section.open .cinerae-section-caret {
        rotate: 90deg;
      }
      .cinerae-section-body {
        padding-bottom: 0.45rem;
      }

      /* ---- umbra: one slider, the tints ---- */
      .cinerae-umbra {
        padding: 0.4rem 0 0.6rem;
      }
      .cinerae-umbra .cinerae-pastilles {
        justify-content: center;
        margin-bottom: 0.9rem;
      }
      .cinerae-umbra-ends {
        display: flex;
        justify-content: space-between;
        color: var(--ink);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        margin-bottom: 0.2rem;
      }
      .cinerae-umbra-row input[type="range"] {
        height: 2rem;
      }

      /* ---- teintes: pastilles of colored dust, no words ---- */
      .cinerae-pastilles {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.55rem;
      }
      .cinerae-pastille {
        appearance: none;
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(232, 221, 204, 0.25);
        cursor: pointer;
        box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
        transition-property: scale, border-color, box-shadow;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-pastille:hover {
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-pastille:active {
        scale: 0.96;
      }
      .cinerae-pastille.active {
        border-color: rgba(232, 221, 204, 0.9);
        box-shadow:
          inset 0 0 4px rgba(0, 0, 0, 0.5),
          0 0 7px rgba(232, 221, 204, 0.35);
      }

      /* ---- aide ---- */
      .cinerae-aide-block {
        margin-bottom: 0.6rem;
      }
      .cinerae-aide-title {
        color: var(--ink);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 0.2rem;
      }
      .cinerae-aide-text {
        color: var(--ink-dim);
        font-size: 0.64rem;
        letter-spacing: 0.04em;
        line-height: 1.65;
        text-wrap: pretty;
      }
      .cinerae-aide-text b {
        color: var(--ink);
        font-weight: 600;
      }
      .cinerae-aide-text a {
        color: var(--ink);
        text-decoration-thickness: from-font;
        text-underline-offset: 2px;
      }
      .cinerae-aide-links {
        margin-bottom: 0.5rem;
      }

      /* ---- selects, mini buttons, hints ---- */
      .cinerae-select-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
        margin-bottom: 0.5rem;
        color: rgba(232, 221, 204, 0.78);
      }
      .cinerae-select {
        appearance: none;
        background: rgba(232, 221, 204, 0.06);
        border: 1px solid rgba(232, 221, 204, 0.25);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.64rem;
        letter-spacing: 0.06em;
        padding: 0.3rem 0.45rem;
        max-width: 60%;
        cursor: pointer;
      }
      .cinerae-select:focus {
        outline: none;
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-select option {
        background: #0b0906;
        color: var(--ink);
      }
      .cinerae-mini-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.5rem;
        align-items: center;
      }
      .cinerae-mini {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.3);
        color: var(--ink);
        padding: 0.3rem 0.6rem;
        min-height: 28px;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, color;
        transition-duration: 0.2s;
      }
      .cinerae-mini:hover:not(:disabled) {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.7);
      }
      .cinerae-mini:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .cinerae-mini.recording {
        border-color: rgba(230, 96, 60, 0.8);
        color: #e6845c;
      }
      .cinerae-hint {
        color: var(--ink-dim);
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        margin-bottom: 0.45rem;
      }
      .cinerae-binding {
        justify-content: space-between;
        color: rgba(232, 221, 204, 0.78);
      }

      /* ---- palette gradient editor ---- */
      .cinerae-colors {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.55rem;
      }
      .cinerae-colors input[type="color"] {
        appearance: none;
        width: 30px;
        height: 26px;
        padding: 0;
        border: 1px solid rgba(232, 221, 204, 0.3);
        background: transparent;
        cursor: pointer;
      }
      .cinerae-colors input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .cinerae-colors input[type="color"]::-webkit-color-swatch {
        border: none;
      }
      .cinerae-color-label {
        color: var(--ink-dim);
        font-size: 0.62rem;
        margin-left: 0.3rem;
      }

      /* ---- modulation ---- */
      .cinerae-lfo-head {
        color: var(--ink-dim);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.58rem;
        margin: 0.5rem 0 0.35rem;
      }
      .cinerae-link {
        border-left: 2px solid rgba(232, 221, 204, 0.15);
        padding-left: 0.55rem;
        margin-bottom: 0.6rem;
      }
      .cinerae-link-selects {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 0.4rem;
      }
      .cinerae-link-selects .cinerae-select {
        flex: 1;
        max-width: none;
        min-width: 0;
      }
      .cinerae-link-arrow {
        color: var(--ink-dim);
      }

      /* ---- modulation and MIDI row marks ---- */
      .cinerae-mod-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--ink-bright);
        margin-left: 0.4rem;
        vertical-align: middle;
        animation: cinerae-breathe 2.4s ease-in-out infinite;
      }
      @keyframes cinerae-breathe {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .cinerae-tag {
        display: inline-block;
        margin-left: 0.4rem;
        padding: 0.05rem 0.3rem;
        border: 1px solid rgba(232, 221, 204, 0.35);
        color: var(--ink-dim);
        font-size: 0.56rem;
        letter-spacing: 0.08em;
        vertical-align: middle;
      }
      .cinerae-row.learnable,
      .cinerae-select-row.learnable {
        outline: 1px dashed rgba(232, 221, 204, 0.25);
        outline-offset: 2px;
        cursor: pointer;
      }
      .cinerae-row.armed,
      .cinerae-select-row.armed {
        outline-color: rgba(232, 221, 204, 0.8);
        background: rgba(232, 221, 204, 0.07);
      }

      /* ---- clean fullscreen: everything fades after a still moment ---- */
      body.cinerae-idle {
        cursor: none;
      }
      body.cinerae-idle .cinerae-panel,
      body.cinerae-idle .cinerae-open {
        opacity: 0;
        pointer-events: none;
        transition-property: opacity;
        transition-duration: 0.8s;
      }

      /* ---- mobile: bottom sheet ---- */
      @media (max-width: 720px), (pointer: coarse) and (max-width: 1024px) {
        .cinerae-panel {
          top: auto;
          right: 0;
          left: 0;
          bottom: 0;
          width: 100%;
          max-height: min(70vh, 34rem);
          border-left: none;
          border-right: none;
          border-bottom: none;
          padding: 0 1.2rem calc(1.2rem + env(safe-area-inset-bottom));
          font-size: 0.8rem;
          translate: 0 0;
          transition-property: translate, opacity;
        }
        .cinerae-panel.collapsed {
          opacity: 1;
          pointer-events: auto;
          translate: 0 calc(100% - 52px);
          overflow-y: hidden;
        }
        .cinerae-open {
          display: none;
        }
        .cinerae-handle {
          display: grid;
          place-items: center;
          appearance: none;
          background: transparent;
          border: none;
          width: 100%;
          height: 52px;
          margin: 0 0 0.2rem;
          cursor: pointer;
        }
        .cinerae-handle-bar {
          display: block;
          width: 56px;
          height: 4px;
          border-radius: 2px;
          background: rgba(232, 221, 204, 0.35);
        }
        .cinerae-close {
          display: none;
        }
        .cinerae-switch,
        .cinerae-modes button,
        .cinerae-actions button {
          min-height: 44px;
        }
        .cinerae-row input[type="range"] {
          height: 2rem;
          font-size: 16px;
        }
        .cinerae-chip {
          min-height: 40px;
          padding: 0.35rem 0.75rem;
          font-size: 0.74rem;
        }
        .cinerae-text-row input {
          font-size: 16px;
        }
        .cinerae-switch-track {
          width: 44px;
          height: 24px;
          border-radius: 12px;
        }
        .cinerae-switch-thumb {
          width: 18px;
          height: 18px;
          border-radius: 9px;
        }
        .cinerae-switch[aria-checked="true"] .cinerae-switch-thumb {
          translate: 20px 0;
        }
        #overlay {
          padding-top: 58vh;
        }
      }

      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        line-height: 1.8;
        color: #d9a08a;
        background: var(--bg);
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <p id="overlay-text">
        Poussière de lumière pilotée par le mouvement et le son. La caméra
        n'est jamais affichée&nbsp;: seul son mouvement souffle sur les
        particules. Le silence cristallise la matière, le son la fait fondre.
        Tout reste local, rien n'est enregistré ni envoyé.
      </p>
      <div class="buttons">
        <button id="start-full" type="button">Activer caméra + micro</button>
        <button id="start-audio" type="button">Micro seul</button>
      </div>
      <div class="error" id="overlay-error"></div>
    </div>
    <div class="cinerae-drop" id="drop-hint">déposer l'image — tout reste local</div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
