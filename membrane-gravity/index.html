<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Membrane Gravity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#membrane{z-index:0}
#particles{z-index:1}
#pill{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  z-index:10;height:44px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;
  cursor:pointer;
  transition:opacity 0.4s ease;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  pointer-events:auto;
}
#pill.faded{opacity:0.2}
.seg{
  height:28px;border-radius:14px;
  transition:width 0.4s ease,border 0.3s ease;
  width:36px;flex-shrink:0;
  border:1px solid transparent;
  cursor:pointer;
}
.seg.active{width:52px;border:1px solid rgba(255,255,255,0.6)}
</style>
</head>
<body>
<canvas id="membrane"></canvas>
<canvas id="particles"></canvas>
<div id="pill"></div>
<script>
"use strict";

// --- Palette definitions ---
const PALETTES={
  ABYSS:{
    name:"ABYSS",
    grad:["#00e5ff","#0055ff","#0033aa"],
    particleHues:[185,220,100],
    particleSat:85,particleLight:60,
    wellHues:[185,210,120,240],
    wellCoreSat:0.2,wellCoreLight:0.9,
    wellGlowSat:0.8,wellGlowLight:0.5,
    membraneHueBase:0.52,membraneHueRange:0.12,
    membraneSat:0.8
  },
  AURORA:{
    name:"AURORA",
    grad:["#00ff87","#00e5ff","#cc44ff"],
    particleHues:[150,180,0],
    particleSat:80,particleLight:65,
    wellHues:[290,320,260,340],
    wellCoreSat:0.9,wellCoreLight:0.6,
    wellGlowSat:0.85,wellGlowLight:0.55,
    membraneHueBase:0.4,membraneHueRange:0.15,
    membraneSat:0.75
  },
  MONO:{
    name:"MONO",
    grad:["#ffffff","#aaaaaa","#666666"],
    particleHues:[0,0,0],
    particleMono:true,
    particleSat:0,particleLight:75,
    wellHues:[0,0,0,0],
    wellCoreSat:0,wellCoreLight:0.92,
    wellGlowSat:0,wellGlowLight:0.8,
    membraneHueBase:0,membraneHueRange:0,
    membraneSat:0
  },
  SYNTHWAVE:{
    name:"SYNTHWAVE",
    grad:["#ff00ff","#8b00ff","#cc00dd"],
    particleHues:[300,180,270],
    particleSat:90,particleLight:60,
    wellHues:[300,190,270,330],
    wellCoreSat:0.95,wellCoreLight:0.65,
    wellGlowSat:0.9,wellGlowLight:0.55,
    membraneHueBase:0.78,membraneHueRange:0.18,
    membraneSat:0.9
  }
};
const PALETTE_KEYS=["ABYSS","AURORA","MONO","SYNTHWAVE"];
let currentPaletteIdx=0;
let paletteMix=0;
let prevPalette=null;
let paletteTransitionStart=0;
const PALETTE_TRANSITION_DUR=400;

function getCurrentPalette(){return PALETTES[PALETTE_KEYS[currentPaletteIdx]];}
function getPrevPalette(){return prevPalette||getCurrentPalette();}

function switchPalette(idx){
  if(idx===currentPaletteIdx)return;
  prevPalette=getCurrentPalette();
  paletteTransitionStart=performance.now();
  paletteMix=0;
  currentPaletteIdx=idx;
  updatePillUI();
}
function cyclePalette(){switchPalette((currentPaletteIdx+1)%4);}

function lerpVal(a,b,t){return a+(b-a)*t;}
function lerpPaletteProp(prop,t){
  const p=getCurrentPalette(),pp=getPrevPalette();
  if(typeof p[prop]==="number")return lerpVal(pp[prop],p[prop],t);
  return p[prop];
}

// --- Pill UI ---
const pill=document.getElementById("pill");
let pillFadeTimer=null;

function buildPill(){
  pill.innerHTML="";
  for(let i=0;i<4;i++){
    const seg=document.createElement("div");
    seg.className="seg"+(i===currentPaletteIdx?" active":"");
    const p=PALETTES[PALETTE_KEYS[i]];
    seg.style.background=`linear-gradient(135deg,${p.grad[0]},${p.grad[1]},${p.grad[2]})`;
    seg.dataset.idx=i;
    seg.addEventListener("pointerdown",e=>{
      e.stopPropagation();
      switchPalette(parseInt(e.currentTarget.dataset.idx));
      resetPillFade();
    });
    pill.appendChild(seg);
  }
}
function updatePillUI(){
  const segs=pill.querySelectorAll(".seg");
  segs.forEach((s,i)=>{
    s.className="seg"+(i===currentPaletteIdx?" active":"");
  });
}

pill.addEventListener("pointerdown",e=>{
  if(e.target===pill){cyclePalette();resetPillFade();}
});

function resetPillFade(){
  pill.classList.remove("faded");
  clearTimeout(pillFadeTimer);
  pillFadeTimer=setTimeout(()=>pill.classList.add("faded"),3000);
}
pill.addEventListener("pointerenter",()=>{pill.classList.remove("faded");clearTimeout(pillFadeTimer);});
pill.addEventListener("pointerleave",()=>{pillFadeTimer=setTimeout(()=>pill.classList.add("faded"),3000);});

document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"){switchPalette(parseInt(e.key)-1);resetPillFade();}
});

buildPill();
resetPillFade();

// --- Canvas setup ---
const G=document.getElementById("membrane"),P=document.getElementById("particles");
const gl=G.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
const ctx=P.getContext("2d");

let W,H,dpr,particleCount;
const MAX_WELLS=8;
const GOLDEN_ANGLE=137.5;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  G.width=W*dpr;G.height=H*dpr;
  P.width=W*dpr;P.height=H*dpr;
  G.style.width=W+"px";G.style.height=H+"px";
  P.style.width=W+"px";P.style.height=H+"px";
  gl.viewport(0,0,G.width,G.height);
  particleCount=W<500?10000:20000;
  initParticles();
}

// --- GLSL Membrane ---
const vsrc=`attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const fsrc=`
precision highp float;
uniform float t;
uniform vec2 r;
uniform vec4 w[8];
uniform int wc;
uniform float uHueBase;
uniform float uHueRange;
uniform float uMemSat;
uniform vec3 uWellColors[8];

vec3 hsl2rgb(float h,float s,float l){
  float c=(1.0-abs(2.0*l-1.0))*s;
  float x=c*(1.0-abs(mod(h*6.0,2.0)-1.0));
  float m=l-c*0.5;
  vec3 rgb;
  float hh=h*6.0;
  if(hh<1.0)rgb=vec3(c,x,0);
  else if(hh<2.0)rgb=vec3(x,c,0);
  else if(hh<3.0)rgb=vec3(0,c,x);
  else if(hh<4.0)rgb=vec3(0,x,c);
  else if(hh<5.0)rgb=vec3(x,0,c);
  else rgb=vec3(c,0,x);
  return rgb+m;
}

float wave(vec2 p,float time){
  float v=0.0;
  for(int i=0;i<8;i++){
    if(i>=wc)break;
    vec2 c=w[i].xy;
    float age=w[i].z;
    float str=w[i].w;
    float d=length(p-c);
    float radius=0.18;
    float falloff=exp(-d*d/(radius*radius*2.0));
    float phase1=d*25.0-time*1.8+age*2.5;
    float phase2=d*12.0-time*1.2+age*1.8;
    float phase3=d*40.0-time*2.5+age*4.0;
    float ripple=sin(phase1)*exp(-d*3.5)*str*0.7;
    ripple+=sin(phase2)*exp(-d*2.5)*str*0.5;
    ripple+=sin(phase3)*exp(-d*6.0)*str*0.2;
    float displacement=falloff*str*0.8;
    v+=ripple+displacement;
  }
  v+=sin(p.x*3.0+t*0.2)*sin(p.y*2.5+t*0.25)*0.04;
  v+=sin(p.x*5.0-t*0.15+p.y*3.0)*0.02;
  return v;
}

void main(){
  vec2 uv=gl_FragCoord.xy/r;
  float v=wave(uv,t);

  float eps=0.0015;
  float dx=wave(uv+vec2(eps,0),t)-wave(uv-vec2(eps,0),t);
  float dy=wave(uv+vec2(0,eps),t)-wave(uv-vec2(0,eps),t);
  float slope=length(vec2(dx,dy));
  float angle=atan(dy,dx);

  float h=fract(v*0.8+angle*0.15+t*0.015);
  h=h*uHueRange+uHueBase;
  float s=uMemSat+slope*1.5;
  s=min(s,0.95);
  float l=slope*1.8+abs(v)*0.25;
  l=min(l,0.6);
  vec3 col=hsl2rgb(h,s,l);

  float crest=smoothstep(0.3,1.5,slope);
  float crestHue=fract(h+0.15);
  float crestSat=uMemSat>0.01?min(uMemSat+0.2,0.95):0.0;
  vec3 crestCol=hsl2rgb(crestHue,crestSat,0.55);
  col=mix(col,crestCol,crest*0.6);
  col*=1.4;

  for(int i=0;i<8;i++){
    if(i>=wc)break;
    vec2 c=w[i].xy;
    float str=w[i].w;
    float d=length(uv-c);

    float glow1=exp(-d*d*25.0)*str*0.7;
    float glow2=exp(-d*d*80.0)*str*0.5;
    float glow3=exp(-d*d*400.0)*str*0.8;

    vec3 wc3=uWellColors[i];
    vec3 wellCore=hsl2rgb(wc3.x,wc3.z,0.65);
    vec3 wellMid=hsl2rgb(fract(wc3.x+0.08),wc3.y,0.45);
    vec3 wellOuter=hsl2rgb(fract(wc3.x-0.05),wc3.y*0.8,0.25);

    col+=wellCore*glow3;
    col+=wellMid*glow2;
    col+=wellOuter*glow1;

    float ring=abs(d-0.06)*50.0;
    float ringGlow=exp(-ring*ring)*str*0.15;
    col+=hsl2rgb(fract(wc3.x+0.1),wc3.z,0.5)*ringGlow;
  }

  col=pow(col,vec3(0.85));
  col=col/(col+0.8)*1.6;
  gl_FragColor=vec4(col,1);
}
`;

function createShader(src,type){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,createShader(vsrc,gl.VERTEX_SHADER));
gl.attachShader(prog,createShader(fsrc,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aLoc=gl.getAttribLocation(prog,"a");
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);

const uT=gl.getUniformLocation(prog,"t");
const uR=gl.getUniformLocation(prog,"r");
const uW=[];const uWC=gl.getUniformLocation(prog,"wc");
const uHueBase=gl.getUniformLocation(prog,"uHueBase");
const uHueRange=gl.getUniformLocation(prog,"uHueRange");
const uMemSat=gl.getUniformLocation(prog,"uMemSat");
const uWellColors=[];
for(let i=0;i<MAX_WELLS;i++){
  uW[i]=gl.getUniformLocation(prog,"w["+i+"]");
  uWellColors[i]=gl.getUniformLocation(prog,"uWellColors["+i+"]");
}

// --- Wells ---
const DEATH_FADE=0,DEATH_IMPLODE=1,DEATH_EXPLODE=2,DEATH_FRAGMENT=3;
const DEATH_DURATIONS=[1.0,0.3,0.5,1.0];
let wells=[];
let wellCounter=0;

function makeDeform(){
  const deform=[];
  for(let d=0;d<7;d++){
    deform.push({
      amp:0.03+Math.random()*0.09,
      freq:1+Math.floor(Math.random()*4),
      phase:Math.random()*Math.PI*2,
      speed:0.3+Math.random()*0.7
    });
  }
  return deform;
}

function addWell(nx,ny){
  if(wells.length>=MAX_WELLS) wells.shift();
  const lifetime=4+Math.random()*2;
  const deathType=(Math.random()*4)|0;
  wells.push({
    x:nx,y:ny,ox:nx,oy:ny,
    strength:0,targetStrength:1,
    colorIdx:wellCounter,
    age:performance.now()*0.001,
    birthTime:performance.now()*0.001,
    lifetime:lifetime,
    deathType:deathType,
    dying:false,deathProgress:0,
    radius:1,flash:0,
    deform:makeDeform(),
    fragments:null,
    id:wellCounter++
  });
}

function resolveWellHue(well,pal){
  return pal.wellHues[well.colorIdx%pal.wellHues.length];
}

// --- Particles ---
let px,py,pvx,pvy,pc,pa,phueIdx;

function initParticles(){
  const n=particleCount;
  px=new Float32Array(n);py=new Float32Array(n);
  pvx=new Float32Array(n);pvy=new Float32Array(n);
  pc=new Float32Array(n);pa=new Float32Array(n);
  phueIdx=new Uint8Array(n);
  for(let i=0;i<n;i++){
    px[i]=Math.random()*W*dpr;
    py[i]=Math.random()*H*dpr;
    pvx[i]=(Math.random()-0.5)*0.5;
    pvy[i]=(Math.random()-0.5)*0.5;
    pc[i]=Math.random()*360;
    pa[i]=0.4+Math.random()*0.6;
    phueIdx[i]=(Math.random()*3)|0;
  }
}

// --- Pointer & drag ---
let pointerX=-100,pointerY=-100,pointerActive=false;
let accelX=0,accelY=0;
const DRAG_DIST=5;
const DRAG_TIME=200;
const dragPoints=new Map();

function normalizeCoord(ex,ey){return[ex/W,1.0-ey/H];}

function isPillHit(e){
  const rect=pill.getBoundingClientRect();
  return e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom;
}

document.addEventListener("pointerdown",e=>{
  e.preventDefault();
  pointerActive=true;
  pointerX=e.clientX;pointerY=e.clientY;
  resetPillFade();
  const pillHit=isPillHit(e);
  const dp={
    x:e.clientX,y:e.clientY,
    startX:e.clientX,startY:e.clientY,
    mode:"pending",pillHit:pillHit
  };
  dp.timer=setTimeout(()=>{
    if(dp.mode==="pending") dp.mode="tap";
  },DRAG_TIME);
  dragPoints.set(e.pointerId,dp);
  e.target.setPointerCapture(e.pointerId);
},{passive:false});

document.addEventListener("pointermove",e=>{
  e.preventDefault();
  pointerX=e.clientX;pointerY=e.clientY;
  const dp=dragPoints.get(e.pointerId);
  if(dp){
    dp.x=e.clientX;dp.y=e.clientY;
    if(dp.mode!=="drag"){
      const dx=e.clientX-dp.startX,dy=e.clientY-dp.startY;
      if(dx*dx+dy*dy>DRAG_DIST*DRAG_DIST){
        dp.mode="drag";
        clearTimeout(dp.timer);
      }
    }
  }
},{passive:false});

document.addEventListener("pointerup",e=>{
  pointerActive=false;
  const dp=dragPoints.get(e.pointerId);
  if(dp){
    clearTimeout(dp.timer);
    if(dp.mode!=="drag"&&!dp.pillHit){
      const[nx,ny]=normalizeCoord(dp.startX,dp.startY);
      addWell(nx,ny);
    }
    dragPoints.delete(e.pointerId);
  }
},{passive:false});

document.addEventListener("pointercancel",e=>{
  pointerActive=false;
  const dp=dragPoints.get(e.pointerId);
  if(dp){clearTimeout(dp.timer);dragPoints.delete(e.pointerId);}
},{passive:false});

if(window.DeviceMotionEvent){
  window.addEventListener("devicemotion",e=>{
    const a=e.accelerationIncludingGravity;
    if(a){
      accelX=Math.max(-0.5,Math.min(0.5,(a.x||0)*0.05));
      accelY=Math.max(-0.5,Math.min(0.5,(a.y||0)*0.05));
    }
  });
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    document.addEventListener("click",()=>{
      DeviceMotionEvent.requestPermission().catch(()=>{});
    },{once:true});
  }
}

function hslToRgb(h,s,l){
  h=((h%360)+360)%360/360;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
  return[f(0)*255|0,f(8)*255|0,f(4)*255|0];
}

function fract(x){return x-Math.floor(x);}

// --- Animation ---
let lastTime=0;

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-lastTime)*0.001,0.05);
  lastTime=now;
  const time=now*0.001;

  const transT=Math.min((now-paletteTransitionStart)/PALETTE_TRANSITION_DUR,1);
  const easeT=transT<1?transT*transT*(3-2*transT):1;
  const pal=getCurrentPalette();
  const ppal=getPrevPalette();

  const memHueBase=lerpVal(ppal.membraneHueBase,pal.membraneHueBase,easeT);
  const memHueRange=lerpVal(ppal.membraneHueRange,pal.membraneHueRange,easeT);
  const memSat=lerpVal(ppal.membraneSat,pal.membraneSat,easeT);

  for(let i=wells.length-1;i>=0;i--){
    const w=wells[i];
    const alive=time-w.birthTime;

    if(!w.dying&&alive>=w.lifetime){
      w.dying=true;
      w.deathProgress=0;
    }

    if(w.dying){
      const dur=DEATH_DURATIONS[w.deathType];
      w.deathProgress+=dt/dur;
      const t=Math.min(w.deathProgress,1);
      w.flash=0;

      if(w.deathType===DEATH_FADE){
        w.targetStrength=(1-t)*(1-t);
        w.radius=1-t*0.8;
      }else if(w.deathType===DEATH_IMPLODE){
        const contract=t*t*t;
        w.radius=Math.max(0.02,1-contract*0.98);
        w.targetStrength=(1-t)*2;
        if(t>0.7) w.flash=(t-0.7)/0.3;
      }else if(w.deathType===DEATH_EXPLODE){
        w.radius=1+t*1.0;
        w.targetStrength=Math.max(0,(1-t)*(1-t)*2);
        if(t<0.3) w.flash=t/0.3;
        else w.flash=Math.max(0,1-(t-0.3)/0.3);
      }else if(w.deathType===DEATH_FRAGMENT){
        if(!w.fragments){
          const count=3+((Math.random()*2)|0);
          w.fragments=[];
          for(let f=0;f<count;f++){
            const ang=(f/count)*Math.PI*2+Math.random()*0.5;
            w.fragments.push({
              ang:ang,
              speed:0.04+Math.random()*0.04,
              scale:0.2+Math.random()*0.15,
              deform:makeDeform()
            });
          }
        }
        w.targetStrength=0;
        w.radius=0;
      }

      if(w.deathProgress>=1){
        wells.splice(i,1);
        continue;
      }
    }

    w.strength+=(w.targetStrength-w.strength)*dt*8;
  }

  // Build temporary drag wells
  const dragWells=[];
  for(const[,dp] of dragPoints){
    if(dp.mode==="drag"){
      if(!dp.deform) dp.deform=makeDeform();
      dragWells.push({
        x:dp.x/W,y:1-dp.y/H,
        strength:3,targetStrength:3,
        colorIdx:0,
        age:time,birthTime:time,lifetime:999,
        radius:2,flash:0,
        deform:dp.deform,
        dying:false,deathProgress:0,deathType:0,fragments:null,
        id:-1
      });
    }
  }
  const allWells=wells.concat(dragWells);

  // --- Render membrane ---
  gl.uniform1f(uT,time);
  gl.uniform2f(uR,G.width,G.height);
  gl.uniform1f(uHueBase,memHueBase);
  gl.uniform1f(uHueRange,memHueRange);
  gl.uniform1f(uMemSat,memSat);

  const glslGlowSat=lerpVal(ppal.wellGlowSat,pal.wellGlowSat,easeT);
  const glslCoreSat=lerpVal(ppal.wellCoreSat,pal.wellCoreSat,easeT);

  gl.uniform1i(uWC,Math.min(allWells.length,MAX_WELLS));
  for(let i=0;i<MAX_WELLS;i++){
    if(i<allWells.length){
      const w=allWells[i];
      gl.uniform4f(uW[i],w.x,w.y,w.age,w.strength);
      const prevH=resolveWellHue(w,ppal);
      const curH=resolveWellHue(w,pal);
      const wh=lerpVal(prevH,curH,easeT)/360;
      gl.uniform3f(uWellColors[i],fract(wh),glslGlowSat,glslCoreSat);
    }else{
      gl.uniform4f(uW[i],0,0,0,0);
      gl.uniform3f(uWellColors[i],0,0,0);
    }
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  // --- Render particles ---
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(0,0,0,0.02)";
  ctx.fillRect(0,0,P.width,P.height);
  ctx.globalCompositeOperation="screen";

  const n=Math.min(particleCount,px.length);
  const ww=W*dpr,hh=H*dpr;

  const wcCoreSat=lerpVal(ppal.wellCoreSat,pal.wellCoreSat,easeT);
  const wcCoreLight=lerpVal(ppal.wellCoreLight,pal.wellCoreLight,easeT);
  const wcGlowSat=lerpVal(ppal.wellGlowSat,pal.wellGlowSat,easeT);
  const wcGlowLight=lerpVal(ppal.wellGlowLight,pal.wellGlowLight,easeT);

  // Well halos on canvas — organic blob shapes
  const SEG=48;
  for(let j=0;j<allWells.length;j++){
    const w=allWells[j];
    const wx=w.x*ww,wy=(1-w.y)*hh;
    const prevH=resolveWellHue(w,ppal);
    const curH=resolveWellHue(w,pal);
    const wh=lerpVal(prevH,curH,easeT);
    const [cr,cg,cb]=hslToRgb(wh,wcCoreSat,wcCoreLight);
    const [or2,og,ob]=hslToRgb(wh,wcGlowSat,wcGlowLight);
    const baseR=Math.min(ww,hh)*0.18;
    const radius=baseR*w.radius;
    if(radius<1)continue;
    const gradR=radius*1.15;
    const grad=ctx.createRadialGradient(wx,wy,0,wx,wy,gradR);
    grad.addColorStop(0,`rgba(${cr},${cg},${cb},${(0.4*w.strength).toFixed(3)})`);
    grad.addColorStop(0.13,`rgba(${cr},${cg},${cb},${(0.25*w.strength).toFixed(3)})`);
    grad.addColorStop(0.35,`rgba(${or2},${og},${ob},${(0.12*w.strength).toFixed(3)})`);
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();
    for(let s=0;s<=SEG;s++){
      const ang=(s/SEG)*Math.PI*2;
      let r=radius;
      for(let d=0;d<w.deform.length;d++){
        const h=w.deform[d];
        r+=radius*h.amp*Math.sin(ang*h.freq+h.phase+time*h.speed);
      }
      const bx=wx+Math.cos(ang)*r,by=wy+Math.sin(ang)*r;
      if(s===0)ctx.moveTo(bx,by);else ctx.lineTo(bx,by);
    }
    ctx.closePath();
    ctx.fill();

    if(w.flash>0){
      const fAlpha=w.flash*0.7;
      const maxFlashPx=w.deathType===DEATH_IMPLODE?30*dpr:radius*0.6;
      const fRad=Math.min(maxFlashPx,radius*0.5);
      const fGrad=ctx.createRadialGradient(wx,wy,0,wx,wy,fRad);
      fGrad.addColorStop(0,`rgba(255,255,255,${fAlpha.toFixed(3)})`);
      fGrad.addColorStop(0.4,`rgba(${cr},${cg},${cb},${(fAlpha*0.4).toFixed(3)})`);
      fGrad.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=fGrad;
      ctx.beginPath();
      ctx.arc(wx,wy,fRad,0,Math.PI*2);
      ctx.fill();
    }

    if(w.fragments&&w.dying){
      const ft=Math.min(w.deathProgress,1);
      const fragAlpha=(1-ft)*(1-ft);
      const fragBaseR=baseR*0.25;
      for(let fi=0;fi<w.fragments.length;fi++){
        const frag=w.fragments[fi];
        const dist=frag.speed*baseR*ft*3;
        const fx=wx+Math.cos(frag.ang)*dist;
        const fy=wy+Math.sin(frag.ang)*dist;
        const fr=fragBaseR*frag.scale*(1-ft*0.5);
        if(fr<1)continue;
        const fGrad=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
        fGrad.addColorStop(0,`rgba(${cr},${cg},${cb},${(0.35*fragAlpha).toFixed(3)})`);
        fGrad.addColorStop(0.4,`rgba(${or2},${og},${ob},${(0.15*fragAlpha).toFixed(3)})`);
        fGrad.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle=fGrad;
        ctx.beginPath();
        for(let s=0;s<=SEG;s++){
          const ang=(s/SEG)*Math.PI*2;
          let r=fr;
          for(let d=0;d<frag.deform.length;d++){
            const h=frag.deform[d];
            r+=fr*h.amp*Math.sin(ang*h.freq+h.phase+time*h.speed);
          }
          const bx=fx+Math.cos(ang)*r,by=fy+Math.sin(ang)*r;
          if(s===0)ctx.moveTo(bx,by);else ctx.lineTo(bx,by);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Lerped particle color params
  const pSat=lerpVal(ppal.particleSat,pal.particleSat,easeT);
  const pLight=lerpVal(ppal.particleLight,pal.particleLight,easeT);
  const isMono=!!pal.particleMono;
  const prevHues=ppal.particleHues;
  const curHues=pal.particleHues;

  // Particles
  for(let i=0;i<n;i++){
    let ax=accelX,ay=accelY;

    for(let j=0;j<allWells.length;j++){
      const w=allWells[j];
      const wx=w.x*ww,wy=(1-w.y)*hh;
      const ddx=wx-px[i],ddy=wy-py[i];
      const dist=Math.sqrt(ddx*ddx+ddy*ddy)+10;
      const force=w.strength*1200/(dist*dist)*dpr;
      const maxForce=3*dpr;
      let f=Math.min(force,maxForce);
      const isExploding=w.dying&&w.deathType===DEATH_EXPLODE;
      const explodeRadius=Math.min(ww,hh)*0.18*2;
      if(isExploding&&dist<explodeRadius)f*=-1.5;
      else if(isExploding)f=0;
      ax+=ddx/dist*f;
      ay+=ddy/dist*f;
      if(!isExploding){
        const tang=f*0.65;
        ax+=-ddy/dist*tang;
        ay+=ddx/dist*tang;
      }
    }

    ax+=(Math.random()-0.5)*1.4;
    ay+=(Math.random()-0.5)*1.4;

    pvx[i]=(pvx[i]+ax*dt)*0.985;
    pvy[i]=(pvy[i]+ay*dt)*0.985;

    const speed=Math.sqrt(pvx[i]*pvx[i]+pvy[i]*pvy[i]);
    const maxSpeed=(0.2+Math.random()*0.3)*dpr*60;
    if(speed>maxSpeed){
      pvx[i]*=maxSpeed/speed;
      pvy[i]*=maxSpeed/speed;
    }

    px[i]+=pvx[i];
    py[i]+=pvy[i];

    if(px[i]<0)px[i]+=ww;
    if(px[i]>ww)px[i]-=ww;
    if(py[i]<0)py[i]+=hh;
    if(py[i]>hh)py[i]-=hh;

    let nearestDist=Infinity;
    for(let j=0;j<allWells.length;j++){
      const w=allWells[j];
      const wx=w.x*ww,wy=(1-w.y)*hh;
      const dd=Math.abs(wx-px[i])+Math.abs(wy-py[i]);
      if(dd<nearestDist)nearestDist=dd;
    }

    const proxGlow=allWells.length>0?Math.max(0,1-nearestDist/(Math.min(ww,hh)*0.4)):0;
    const baseAlpha=0.08+proxGlow*0.25;
    const speedAlpha=Math.min(speed*0.08,0.4);
    const alpha=Math.min(pa[i]*(baseAlpha+speedAlpha),0.7);

    const hi=phueIdx[i]%3;
    const prevH=prevHues[hi%prevHues.length];
    const curH=curHues[hi%curHues.length];
    const pH=isMono?0:lerpVal(prevH,curH,easeT);
    const finalSat=isMono?pSat:(pSat+proxGlow*15);
    const finalLight=pLight+proxGlow*15;

    ctx.fillStyle=`hsla(${pH|0},${finalSat|0}%,${finalLight|0}%,${alpha.toFixed(3)})`;
    ctx.fillRect(px[i],py[i],1,1);
  }

  // Cursor glow
  if(pointerX>0&&pointerY>0){
    const cx=pointerX*dpr,cy=pointerY*dpr;
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,8*dpr);
    grad.addColorStop(0,"rgba(255,255,255,0.95)");
    grad.addColorStop(0.2,"rgba(255,255,255,0.5)");
    grad.addColorStop(0.5,"rgba(200,220,255,0.15)");
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(cx,cy,8*dpr,0,Math.PI*2);
    ctx.fill();
  }
}

window.addEventListener("resize",resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
