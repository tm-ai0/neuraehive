<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINERÆ</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: #050403;
        color: #e8ddcc;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      canvas#stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: radial-gradient(ellipse at center, rgba(5, 4, 3, 0.25), rgba(5, 4, 3, 0.82));
        transition: opacity 0.9s ease;
        z-index: 10;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay h1 {
        font-size: clamp(2.2rem, 6vw, 4rem);
        font-weight: 200;
        letter-spacing: 0.55em;
        margin-left: 0.55em;
        color: #f2e7d3;
      }
      #overlay p {
        max-width: 34rem;
        text-align: center;
        font-size: 0.82rem;
        line-height: 1.7;
        letter-spacing: 0.08em;
        color: rgba(232, 221, 204, 0.55);
        padding: 0 1.5rem;
      }
      #overlay .buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      #overlay button {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.4);
        color: #e8ddcc;
        padding: 0.85rem 1.8rem;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.25s ease, border-color 0.25s ease;
      }
      #overlay button:hover {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.8);
      }
      #overlay .error {
        color: #d9a08a;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        min-height: 1.2em;
      }
      .cinerae-panel {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 15.5rem;
        padding: 0.9rem 1rem 1rem;
        background: rgba(5, 4, 3, 0.72);
        border: 1px solid rgba(232, 221, 204, 0.14);
        backdrop-filter: blur(6px);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        z-index: 5;
        user-select: none;
      }
      .cinerae-fps {
        font-size: 0.92rem;
        letter-spacing: 0.18em;
        color: #f2e7d3;
        margin-bottom: 0.15rem;
      }
      .cinerae-status {
        color: rgba(232, 221, 204, 0.5);
        margin-bottom: 0.7rem;
        min-height: 1em;
      }
      .cinerae-crystal {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 0.8rem;
      }
      .cinerae-crystal-label {
        color: rgba(232, 221, 204, 0.5);
      }
      .cinerae-crystal-track {
        flex: 1;
        height: 3px;
        background: rgba(232, 221, 204, 0.12);
        overflow: hidden;
      }
      .cinerae-crystal-fill {
        display: block;
        height: 100%;
        width: 0%;
        background: #e8ddcc;
        transition: width 0.2s linear;
      }
      .cinerae-row {
        display: grid;
        grid-template-columns: 1fr auto;
        row-gap: 0.15rem;
        margin-bottom: 0.55rem;
        color: rgba(232, 221, 204, 0.78);
      }
      .cinerae-row input[type="range"] {
        grid-column: 1 / 2;
        width: 100%;
        accent-color: #cfc2a6;
        height: 1rem;
      }
      .cinerae-row .cinerae-value {
        justify-self: end;
        align-self: end;
        color: rgba(232, 221, 204, 0.45);
        font-variant-numeric: tabular-nums;
      }
      .cinerae-row select {
        grid-column: 1 / 3;
        background: rgba(5, 4, 3, 0.9);
        color: #e8ddcc;
        border: 1px solid rgba(232, 221, 204, 0.2);
        padding: 0.25rem 0.3rem;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        line-height: 1.8;
        color: #d9a08a;
        background: #050403;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <h1>CINERÆ</h1>
      <p>
        Poussière de lumière pilotée par le mouvement et le son. La caméra
        n'est jamais affichée&nbsp;: seul son mouvement souffle sur les
        particules. Le silence cristallise la matière, le son la fait fondre.
        Tout reste local, rien n'est enregistré ni envoyé.
      </p>
      <div class="buttons">
        <button id="start-full" type="button">Activer caméra + micro</button>
        <button id="start-audio" type="button">Micro seul</button>
      </div>
      <div class="error" id="overlay-error"></div>
    </div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
