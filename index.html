<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINERÆ</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ddcc;
        --ink-bright: #f2e7d3;
        --ink-dim: rgba(232, 221, 204, 0.5);
        --ink-faint: rgba(232, 221, 204, 0.14);
        --bg: #050403;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      canvas#stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      :focus-visible {
        outline: 2px solid rgba(232, 221, 204, 0.85);
        outline-offset: 1px;
      }

      /* ---- intro (the title itself is particles on the canvas) ---- */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 56vh;
        gap: 1.5rem;
        opacity: 0;
        transition-property: opacity;
        transition-duration: 1.4s;
        transition-timing-function: ease-out;
        z-index: 10;
      }
      #overlay.shown {
        opacity: 1;
      }
      #overlay.gone {
        opacity: 0;
        transition-duration: 0.9s;
      }
      #overlay p {
        max-width: 36rem;
        text-align: center;
        font-size: 0.88rem;
        line-height: 1.75;
        letter-spacing: 0.05em;
        color: rgba(240, 231, 214, 0.92);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
        padding: 0 1.5rem;
        text-wrap: pretty;
      }
      #overlay .buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        pointer-events: auto;
      }
      #overlay.gone .buttons {
        pointer-events: none;
      }
      #overlay button {
        appearance: none;
        background: rgba(5, 4, 3, 0.5);
        border: 1px solid rgba(232, 221, 204, 0.45);
        color: var(--ink);
        padding: 0.85rem 1.8rem;
        min-height: 44px;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, color, scale;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      #overlay button:hover {
        background: rgba(232, 221, 204, 0.16);
        border-color: rgba(232, 221, 204, 0.95);
        color: var(--ink-bright);
      }
      #overlay button:active {
        scale: 0.96;
        background: rgba(232, 221, 204, 0.26);
      }
      #overlay .error {
        color: #d9a08a;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        min-height: 1.2em;
      }

      /* ---- settings panel: a single column, nothing ever scrolls ---- */
      .cinerae-panel {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 17.5rem;
        max-height: calc(100vh - 2rem);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 0.7rem 0.9rem 0.55rem;
        background: rgba(5, 4, 3, 0.84);
        border: 1px solid var(--ink-faint);
        backdrop-filter: blur(8px);
        font-size: 0.66rem;
        letter-spacing: 0.05em;
        z-index: 20;
        user-select: none;
        transition-property: opacity, translate;
        transition-duration: 0.3s;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .cinerae-panel.collapsed {
        opacity: 0;
        translate: 0 -0.5rem;
        pointer-events: none;
      }
      .cinerae-open {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        appearance: none;
        background: rgba(5, 4, 3, 0.7);
        border: 1px solid var(--ink-faint);
        color: var(--ink-dim);
        cursor: pointer;
        z-index: 19;
        opacity: 0;
        pointer-events: none;
        transition-property: opacity, color, scale;
        transition-duration: 0.25s;
        transition-timing-function: ease-out;
      }
      .cinerae-open.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .cinerae-open:hover {
        color: var(--ink-bright);
      }
      .cinerae-open:active {
        scale: 0.96;
      }
      .cinerae-open svg {
        width: 20px;
        height: 20px;
      }
      .cinerae-handle {
        display: none;
      }
      .cinerae-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.1rem;
        flex: none;
      }
      .cinerae-fps {
        font-size: 0.9rem;
        letter-spacing: 0.18em;
        color: var(--ink-bright);
        font-variant-numeric: tabular-nums;
      }
      .cinerae-close {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--ink-dim);
        font-size: 1rem;
        line-height: 1;
        width: 32px;
        height: 32px;
        margin: -6px -8px 0 0;
        cursor: pointer;
        transition-property: color;
        transition-duration: 0.2s;
      }
      .cinerae-close:hover {
        color: var(--ink-bright);
      }
      .cinerae-status {
        color: var(--ink-dim);
        margin-bottom: 0.45rem;
        min-height: 1em;
        flex: none;
      }
      .cinerae-lang {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.25);
        color: var(--ink-dim);
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 0.15rem 0.5rem;
        margin-left: auto;
        margin-right: 0.4rem;
        min-height: 26px;
        cursor: pointer;
        transition-property: color, border-color;
        transition-duration: 0.2s;
      }
      .cinerae-lang:hover {
        color: var(--ink-bright);
        border-color: rgba(232, 221, 204, 0.55);
      }
      /* Three real tabs: the active one is a solid inverted block. */
      .cinerae-modes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        border: 1px solid rgba(232, 221, 204, 0.3);
        margin-bottom: 0.5rem;
        flex: none;
      }
      .cinerae-modes button {
        appearance: none;
        background: transparent;
        border: none;
        color: var(--ink-dim);
        padding: 0.4rem 0.2rem;
        min-height: 32px;
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-modes button + button {
        border-left: 1px solid rgba(232, 221, 204, 0.2);
      }
      .cinerae-modes button:hover {
        color: var(--ink);
      }
      .cinerae-modes button.active {
        background: var(--ink);
        color: #0b0906;
        font-weight: 600;
      }
      .cinerae-sensors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
        margin-bottom: 0.35rem;
        flex: none;
      }
      .cinerae-sensors .cinerae-switch {
        margin-bottom: 0;
      }

      /* ---- five-band gauge: what the microphone really hears ---- */
      .cinerae-bands {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.45rem;
        margin-bottom: 0.4rem;
        flex: none;
      }
      .cinerae-band {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
      }
      .cinerae-band-track {
        position: relative;
        height: 22px;
        border: 1px solid var(--ink-faint);
        background: rgba(232, 221, 204, 0.04);
        overflow: hidden;
      }
      .cinerae-band-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: var(--ink-dim);
        transition-property: height;
        transition-duration: 0.09s;
        transition-timing-function: linear;
      }
      .cinerae-band-name {
        font-size: 0.5rem;
        letter-spacing: 0.05em;
        color: var(--ink-dim);
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cinerae-switch {
        appearance: none;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
        color: rgba(232, 221, 204, 0.82);
        font-size: 0.64rem;
        letter-spacing: 0.05em;
        padding: 0;
        height: 24px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .cinerae-switch > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cinerae-switch-track {
        position: relative;
        flex: none;
        width: 30px;
        height: 16px;
        border-radius: 8px;
        border: 1px solid rgba(232, 221, 204, 0.3);
        transition-property: background-color, border-color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: var(--ink-dim);
        transition-property: translate, background-color;
        transition-duration: 0.2s;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      .cinerae-switch[aria-checked="true"] .cinerae-switch-track {
        background: rgba(232, 221, 204, 0.18);
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-switch[aria-checked="true"] .cinerae-switch-thumb {
        translate: 14px 0;
        background: var(--ink-bright);
      }
      .cinerae-actions {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
        flex: none;
      }
      .cinerae-actions .cinerae-undo {
        width: 38px;
        padding: 0;
        font-size: 0.9rem;
        letter-spacing: 0;
      }
      .cinerae-actions .cinerae-undo:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .cinerae-actions .cinerae-undo:disabled:hover {
        background: transparent;
        border-color: rgba(232, 221, 204, 0.35);
      }
      .cinerae-actions button {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.35);
        color: var(--ink);
        padding: 0.35rem 0;
        min-height: 30px;
        font-size: 0.64rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, scale;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-actions button:hover {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.7);
      }
      .cinerae-actions button:active {
        scale: 0.96;
      }
      .cinerae-crystal {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 0.45rem;
        flex: none;
      }
      .cinerae-crystal-label {
        color: var(--ink-dim);
        font-size: 0.58rem;
        letter-spacing: 0.12em;
      }
      .cinerae-crystal-track {
        flex: 1;
        height: 3px;
        background: rgba(232, 221, 204, 0.12);
        overflow: hidden;
      }
      .cinerae-crystal-fill {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--ink);
        transition-property: width;
        transition-duration: 0.2s;
        transition-timing-function: linear;
      }

      /* ---- accordion sections: one open at a time ---- */
      .cinerae-section {
        border-top: 1px solid var(--ink-faint);
        flex: none;
      }
      .cinerae-section-head {
        appearance: none;
        background: transparent;
        border: none;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.45rem;
        color: var(--ink-dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.58rem;
        height: 23px;
        padding: 0;
        cursor: pointer;
        transition-property: color;
        transition-duration: 0.2s;
        text-align: left;
      }
      .cinerae-section-head:hover {
        color: var(--ink);
      }
      .cinerae-section.open .cinerae-section-head {
        color: var(--ink-bright);
      }
      .cinerae-section-caret {
        width: 0;
        height: 0;
        flex: none;
        border-left: 4px solid currentColor;
        border-top: 3.5px solid transparent;
        border-bottom: 3.5px solid transparent;
        transition-property: rotate;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-section.open .cinerae-section-caret {
        rotate: 90deg;
      }
      .cinerae-section-body {
        padding: 0.1rem 0 0.35rem;
      }
      .cinerae-section:not(.open) .cinerae-section-body {
        display: none;
      }

      /* ---- sub-tabs of a tall section (never a scrollbar) ---- */
      .cinerae-subtabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.1rem;
        margin-bottom: 7px;
        border-bottom: 1px solid var(--ink-faint);
      }
      .cinerae-subtabs button {
        appearance: none;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--ink-dim);
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.2rem 0.4rem 0.25rem;
        min-height: 24px;
        cursor: pointer;
        transition-property: color, border-color;
        transition-duration: 0.2s;
      }
      .cinerae-subtabs button:hover {
        color: var(--ink);
      }
      .cinerae-subtabs button.active {
        color: var(--ink-bright);
        border-bottom-color: rgba(232, 221, 204, 0.8);
      }

      /* ---- the shared fader template: one fixed-height row ---- */
      .cinerae-row {
        position: relative;
        height: 24px;
        margin-bottom: 4px;
      }
      .cinerae-row input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background: linear-gradient(
          to right,
          rgba(232, 221, 204, 0.14) var(--f, 50%),
          rgba(232, 221, 204, 0.045) var(--f, 50%)
        );
        border: 1px solid rgba(232, 221, 204, 0.1);
        cursor: pointer;
        transition-property: border-color;
        transition-duration: 0.2s;
      }
      .cinerae-row:hover input[type="range"],
      .cinerae-row:focus-within input[type="range"] {
        border-color: rgba(232, 221, 204, 0.35);
      }
      .cinerae-row input[type="range"]::-webkit-slider-runnable-track {
        background: transparent;
        height: 100%;
      }
      .cinerae-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 2px;
        height: 22px;
        background: var(--ink-bright);
      }
      .cinerae-row input[type="range"]::-moz-range-track {
        background: transparent;
        height: 100%;
      }
      .cinerae-row input[type="range"]::-moz-range-thumb {
        width: 2px;
        height: 22px;
        border: none;
        border-radius: 0;
        background: var(--ink-bright);
      }
      /* The name never intercepts the drag: the whole row is the fader.
       * MIDI learn re-enables the tap on the name to arm a binding. */
      .cinerae-row-name {
        position: absolute;
        left: 0.5rem;
        top: 50%;
        translate: 0 -50%;
        max-width: 58%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgba(232, 221, 204, 0.85);
        pointer-events: none;
      }
      .cinerae-row.learnable .cinerae-row-name {
        pointer-events: auto;
        cursor: pointer;
      }
      .cinerae-value {
        position: absolute;
        right: 0.5rem;
        top: 50%;
        translate: 0 -50%;
        max-width: 40%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgba(232, 221, 204, 0.55);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        transition-property: color;
        transition-duration: 0.5s;
        transition-timing-function: ease-out;
      }
      .cinerae-row.changed .cinerae-value {
        color: var(--ink-bright);
        transition-duration: 0.12s;
      }

      /* ---- selects, colors, minis: same fixed-height template ---- */
      .cinerae-select-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        height: 24px;
        margin-bottom: 4px;
        color: rgba(232, 221, 204, 0.85);
      }
      .cinerae-select-row .cinerae-row-name {
        position: static;
        translate: none;
        flex: 1;
      }
      .cinerae-select {
        appearance: none;
        background: rgba(232, 221, 204, 0.06);
        border: 1px solid rgba(232, 221, 204, 0.22);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.62rem;
        letter-spacing: 0.05em;
        padding: 0 0.4rem;
        height: 24px;
        max-width: 58%;
        cursor: pointer;
      }
      .cinerae-select:focus {
        outline: none;
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-select option {
        background: #0b0906;
        color: var(--ink);
      }
      .cinerae-colors {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        height: 24px;
        margin-bottom: 4px;
      }
      .cinerae-colors .cinerae-row-name {
        position: static;
        translate: none;
        flex: 1;
      }
      .cinerae-colors input[type="color"] {
        appearance: none;
        width: 26px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(232, 221, 204, 0.3);
        background: transparent;
        cursor: pointer;
        flex: none;
      }
      .cinerae-colors input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .cinerae-colors input[type="color"]::-webkit-color-swatch {
        border: none;
      }
      .cinerae-mini-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-bottom: 5px;
        align-items: center;
      }
      .cinerae-binding {
        justify-content: space-between;
        color: rgba(232, 221, 204, 0.82);
      }
      .cinerae-mini {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.3);
        color: var(--ink);
        padding: 0 0.55rem;
        height: 24px;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition-property: background-color, border-color, color;
        transition-duration: 0.2s;
      }
      .cinerae-mini:hover:not(:disabled) {
        background: rgba(232, 221, 204, 0.08);
        border-color: rgba(232, 221, 204, 0.7);
      }
      .cinerae-mini:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .cinerae-mini.recording {
        border-color: rgba(230, 96, 60, 0.8);
        color: #e6845c;
      }
      .cinerae-slotline {
        color: var(--ink-dim);
        font-size: 0.6rem;
        letter-spacing: 0.05em;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cinerae-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-bottom: 5px;
      }
      .cinerae-chip {
        appearance: none;
        background: transparent;
        border: 1px solid rgba(232, 221, 204, 0.22);
        color: var(--ink-dim);
        padding: 0 0.5rem;
        height: 24px;
        font-size: 0.6rem;
        letter-spacing: 0.07em;
        cursor: pointer;
        transition-property: background-color, border-color, color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-chip:hover {
        border-color: rgba(232, 221, 204, 0.55);
        color: var(--ink);
      }
      .cinerae-chip.active {
        background: rgba(232, 221, 204, 0.14);
        border-color: rgba(232, 221, 204, 0.7);
        color: var(--ink-bright);
      }
      .cinerae-text-row input {
        width: 100%;
        appearance: none;
        background: rgba(232, 221, 204, 0.06);
        border: 1px solid rgba(232, 221, 204, 0.25);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        height: 26px;
        padding: 0 0.55rem;
        margin-bottom: 5px;
      }
      .cinerae-text-row input:focus {
        outline: none;
        border-color: rgba(232, 221, 204, 0.6);
      }
      .cinerae-drop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-bright);
        background: rgba(5, 4, 3, 0.55);
        border: 1px dashed rgba(232, 221, 204, 0.45);
        z-index: 25;
        pointer-events: none;
      }
      .cinerae-drop.visible {
        display: flex;
      }

      /* ---- macros: the three journeys, at the head of every mode ---- */
      .cinerae-macros {
        padding: 0 0 0.35rem;
        margin-bottom: 0.35rem;
        border-bottom: 1px solid var(--ink-faint);
        flex: none;
      }
      .cinerae-macros .cinerae-row {
        height: 28px;
      }
      .cinerae-macros .cinerae-row input[type="range"]::-webkit-slider-thumb {
        height: 26px;
      }
      .cinerae-macros .cinerae-row input[type="range"]::-moz-range-thumb {
        height: 26px;
      }
      .cinerae-macros .cinerae-row-name {
        color: var(--ink);
      }

      /* ---- invitation pulse: one slider breathes, briefly ---- */
      .cinerae-row.invited input[type="range"] {
        animation: cinerae-invite 1.8s ease-in-out 3;
      }
      @keyframes cinerae-invite {
        0%,
        100% {
          border-color: rgba(232, 221, 204, 0.1);
          box-shadow: none;
        }
        50% {
          border-color: rgba(232, 221, 204, 0.7);
          box-shadow:
            0 0 10px rgba(232, 221, 204, 0.16),
            inset 0 0 8px rgba(232, 221, 204, 0.07);
        }
      }
      /* Reduced motion: the invitation still shows, as a steady glow with
         no animation — motion is never the only channel. */
      @media (prefers-reduced-motion: reduce) {
        .cinerae-row.invited input[type="range"] {
          animation: none;
          border-color: rgba(232, 221, 204, 0.55) !important;
          box-shadow:
            0 0 10px rgba(232, 221, 204, 0.14),
            inset 0 0 8px rgba(232, 221, 204, 0.06);
        }
      }

      /* ---- umbra: the tints, one slider ---- */
      .cinerae-umbra {
        padding: 0.2rem 0 0.4rem;
      }
      .cinerae-umbra-ends {
        display: flex;
        justify-content: space-between;
        color: var(--ink);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        margin: 0.55rem 0 0.3rem;
      }
      .cinerae-umbra-row {
        height: 34px;
      }
      .cinerae-umbra-row input[type="range"]::-webkit-slider-thumb {
        height: 32px;
      }
      .cinerae-umbra-row input[type="range"]::-moz-range-thumb {
        height: 32px;
      }

      /* ---- teintes: the real palette, its name readable ---- */
      .cinerae-teintes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-bottom: 6px;
      }
      .cinerae-teinte {
        appearance: none;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 3px 6px 3px;
        background: rgba(232, 221, 204, 0.03);
        border: 1px solid rgba(232, 221, 204, 0.14);
        cursor: pointer;
        text-align: left;
        transition-property: border-color, background-color;
        transition-duration: 0.2s;
        transition-timing-function: ease-out;
      }
      .cinerae-teinte:hover {
        border-color: rgba(232, 221, 204, 0.5);
      }
      .cinerae-teinte:active {
        scale: 0.98;
      }
      .cinerae-teinte.active {
        border-color: rgba(232, 221, 204, 0.85);
        background: rgba(232, 221, 204, 0.07);
      }
      .cinerae-teinte-band {
        display: block;
        width: 100%;
        height: 6px;
      }
      .cinerae-teinte-name {
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        color: rgba(232, 221, 204, 0.75);
      }
      .cinerae-teinte.active .cinerae-teinte-name {
        color: var(--ink-bright);
      }

      /* ---- aide: terms left, plain words right ---- */
      .cinerae-aide-item {
        display: grid;
        grid-template-columns: 4.4rem 1fr;
        gap: 0.5rem;
        align-items: baseline;
        margin-bottom: 0.4rem;
      }
      .cinerae-aide-term {
        color: var(--ink);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
      }
      .cinerae-aide-term kbd {
        display: inline-block;
        min-width: 1.5rem;
        padding: 0.1rem 0.3rem;
        border: 1px solid rgba(232, 221, 204, 0.35);
        border-bottom-width: 2px;
        text-align: center;
        font-family: inherit;
        font-size: 0.6rem;
        color: var(--ink);
        background: rgba(232, 221, 204, 0.05);
      }
      .cinerae-aide-text {
        color: rgba(232, 221, 204, 0.68);
        font-size: 0.62rem;
        letter-spacing: 0.04em;
        line-height: 1.55;
        text-wrap: pretty;
      }
      .cinerae-aide-text b {
        color: var(--ink);
        font-weight: 600;
      }
      .cinerae-aide-text a {
        color: var(--ink);
        text-decoration-thickness: from-font;
        text-underline-offset: 2px;
      }
      .cinerae-aide-links {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.35rem 0;
        font-size: 0.66rem;
      }
      .cinerae-aide-links a {
        color: var(--ink);
        text-decoration-thickness: from-font;
        text-underline-offset: 2px;
      }
      .cinerae-linktree {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        color: var(--ink-dim);
        transition-property: color;
        transition-duration: 0.2s;
      }
      .cinerae-linktree:hover {
        color: var(--ink-bright);
      }
      .cinerae-linktree svg {
        width: 16px;
        height: 16px;
      }

      /* ---- reserved hint slot: hints never move anything ---- */
      .cinerae-hintbar {
        flex: none;
        height: 2.3rem;
        margin-top: 0.25rem;
        padding-top: 0.3rem;
        border-top: 1px solid var(--ink-faint);
        color: rgba(232, 221, 204, 0.55);
        font-size: 0.6rem;
        letter-spacing: 0.04em;
        line-height: 1.45;
        overflow: hidden;
        text-wrap: pretty;
      }

      /* ---- modulation link rows ---- */
      .cinerae-link {
        border-left: 2px solid rgba(232, 221, 204, 0.15);
        padding-left: 0.55rem;
        margin-bottom: 0.5rem;
      }
      .cinerae-link-selects {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 5px;
      }
      .cinerae-link-selects .cinerae-select {
        flex: 1;
        max-width: none;
        min-width: 0;
      }
      .cinerae-link-arrow {
        color: var(--ink-dim);
      }

      /* ---- modulation and MIDI row marks ---- */
      .cinerae-mod-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--ink-bright);
        margin-left: 0.4rem;
        vertical-align: middle;
        animation: cinerae-breathe 2.4s ease-in-out infinite;
      }
      @keyframes cinerae-breathe {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .cinerae-tag {
        display: inline-block;
        margin-left: 0.4rem;
        padding: 0.05rem 0.3rem;
        border: 1px solid rgba(232, 221, 204, 0.35);
        color: var(--ink-dim);
        font-size: 0.56rem;
        letter-spacing: 0.08em;
        vertical-align: middle;
      }
      .cinerae-row.learnable,
      .cinerae-select-row.learnable {
        outline: 1px dashed rgba(232, 221, 204, 0.25);
        outline-offset: 2px;
        cursor: pointer;
      }
      .cinerae-row.armed,
      .cinerae-select-row.armed {
        outline-color: rgba(232, 221, 204, 0.8);
        background: rgba(232, 221, 204, 0.07);
      }

      /* ---- clean fullscreen: everything fades after a still moment ---- */
      body.cinerae-idle {
        cursor: none;
      }
      body.cinerae-idle .cinerae-panel,
      body.cinerae-idle .cinerae-open {
        opacity: 0;
        pointer-events: none;
        transition-property: opacity;
        transition-duration: 0.8s;
      }

      @media (prefers-reduced-motion: reduce) {
        .cinerae-panel,
        .cinerae-panel *,
        #overlay,
        #overlay * {
          transition-duration: 0.01s !important;
          animation-duration: 0.01s !important;
        }
      }

      /* ---- mobile: bottom sheet, same rules, bigger targets ---- */
      @media (max-width: 720px), (pointer: coarse) and (max-width: 1024px) {
        .cinerae-panel {
          top: auto;
          right: 0;
          left: 0;
          bottom: 0;
          width: 100%;
          max-height: 86vh;
          border-left: none;
          border-right: none;
          border-bottom: none;
          padding: 0 1.2rem calc(0.8rem + env(safe-area-inset-bottom));
          font-size: 0.78rem;
          translate: 0 0;
          transition-property: translate, opacity;
        }
        .cinerae-panel.collapsed {
          opacity: 1;
          pointer-events: auto;
          translate: 0 calc(100% - 52px);
        }
        .cinerae-open {
          display: none;
        }
        .cinerae-handle {
          display: grid;
          place-items: center;
          appearance: none;
          background: transparent;
          border: none;
          width: 100%;
          height: 52px;
          margin: 0 0 0.2rem;
          cursor: pointer;
        }
        .cinerae-handle-bar {
          display: block;
          width: 56px;
          height: 4px;
          border-radius: 2px;
          background: rgba(232, 221, 204, 0.35);
        }
        .cinerae-close {
          display: none;
        }
        .cinerae-switch,
        .cinerae-modes button,
        .cinerae-actions button {
          min-height: 44px;
        }
        .cinerae-switch {
          height: 44px;
        }
        .cinerae-row,
        .cinerae-select-row,
        .cinerae-colors {
          height: 40px;
        }
        .cinerae-row input[type="range"]::-webkit-slider-thumb {
          height: 38px;
          width: 3px;
        }
        .cinerae-row input[type="range"]::-moz-range-thumb {
          height: 38px;
          width: 3px;
        }
        .cinerae-select {
          height: 36px;
        }
        .cinerae-chip,
        .cinerae-mini {
          height: 40px;
          padding: 0 0.75rem;
          font-size: 0.7rem;
        }
        .cinerae-subtabs button {
          min-height: 36px;
        }
        .cinerae-text-row input {
          height: 40px;
          font-size: 16px;
        }
        .cinerae-switch-track {
          width: 44px;
          height: 24px;
          border-radius: 12px;
        }
        .cinerae-switch-thumb {
          width: 18px;
          height: 18px;
          border-radius: 9px;
        }
        .cinerae-switch[aria-checked="true"] .cinerae-switch-thumb {
          translate: 20px 0;
        }
        #overlay {
          padding-top: 58vh;
        }
      }

      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        line-height: 1.8;
        color: #d9a08a;
        background: var(--bg);
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <p id="overlay-text">
        Poussière de lumière pilotée par le mouvement et le son. La caméra
        n'est jamais affichée&nbsp;: seul son mouvement souffle sur les
        particules. La musique anime la matière, le corps la sculpte.
        Tout reste local, rien n'est enregistré ni envoyé.
      </p>
      <div class="buttons">
        <button id="start-full" type="button">Activer caméra + micro</button>
        <button id="start-audio" type="button">Micro seul</button>
      </div>
      <div class="error" id="overlay-error"></div>
    </div>
    <div class="cinerae-drop" id="drop-hint">déposer l'image — tout reste local</div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
